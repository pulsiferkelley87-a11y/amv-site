<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>缠论 · 缠中说禅</title>
<script src="echarts.min.js"></script>
<style>
:root{
  --bg:#0a0e15; --card:#121a26; --card2:#0f1622; --line:rgba(255,255,255,.08);
  --text:#e6ebf3; --muted:#8b98ad; --accent:#6366f1; --up:#ef4444; --down:#22c55e;
  --amber:#f59e0b; --radius:12px; --head:56px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{position:sticky;top:0;z-index:20;height:var(--head);display:flex;align-items:center;gap:14px;
  padding:0 16px;background:rgba(10,14,21,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.5px}
.brand b{color:var(--accent)}
.idx{display:flex;gap:16px;margin-left:auto;font-size:12px;color:var(--muted)}
.idx b{color:var(--text);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--card2);font-size:12px}
.btn:hover{border-color:rgba(255,255,255,.2)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
nav{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:var(--head);z-index:19;background:var(--bg)}
nav .tab{padding:6px 14px;border-radius:999px;border:1px solid transparent;color:var(--muted);font-size:13px}
nav .tab:hover{color:var(--text)}
nav .tab.on{background:rgba(99,102,241,.16);border-color:rgba(99,102,241,.5);color:#c7d2fe}
main{padding:14px 16px 60px;max-width:1680px;margin:0 auto}
section{display:none}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px}
.card>h3{margin:0;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card>h3 small{color:var(--muted);font-weight:400}
.card .bd{padding:12px 14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.g4,.g2{grid-template-columns:1fr}}
.kpi .lab{color:var(--muted);font-size:12px}
.kpi .val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0}
.kpi .sub{color:var(--muted);font-size:12px}
.up{color:var(--up)} .down{color:var(--down)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tbody tr:hover{background:rgba(255,255,255,.03)}
.scroll{max-height:520px;overflow:auto}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid}
.t1{color:#f87171;border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.1)}
.t2{color:#fbbf24;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.1)}
.t3{color:#34d399;border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1)}
.t4{color:#a78bfa;border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.1)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
input[type=text]{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 10px;font:inherit;width:150px}
#chart{height:520px}
#macd{height:150px}
.kl{display:grid;grid-template-columns:1fr 300px;gap:12px}
@media(max-width:1100px){.kl{grid-template-columns:1fr}}
.side{max-height:690px;overflow:auto}
.side table{font-size:12px}
.side th,.side td{padding:4px 6px}
.muted{color:var(--muted)}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
footer{color:var(--muted);font-size:12px;padding:18px 16px;text-align:center}
  #live .grid { align-items: start; }
  #live .kpi .sub { font-size: 12px; color: #8b98ad; margin-top: 4px; }
@media(max-width:760px){
  header{gap:8px;padding:0 10px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  header .brand{flex:0 0 auto;font-size:13px;white-space:nowrap}
  header .btn{flex:0 0 auto;font-size:12px;padding:5px 8px;white-space:nowrap}
  #idxBar{display:none}
  nav{padding:8px 10px;gap:4px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  nav .tab{flex:0 0 auto;white-space:nowrap;font-size:12px;padding:5px 9px}
  main{padding:8px}
  .card{margin-bottom:8px}
  .card .bd{padding:8px 10px}
  .bar{overflow-x:auto;flex-wrap:nowrap;gap:4px;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .bar .btn{flex:0 0 auto;white-space:nowrap;font-size:12px;padding:5px 7px}
  .bar input[type=text]{flex:0 0 auto;width:88px;font-size:12px}
  .kl{grid-template-columns:1fr}
  .kl .side{margin-top:8px}
  #chart{height:300px}
  #macd{height:110px}
  #klineMeta{white-space:nowrap}
#klLegend{font-size:10px;line-height:1.5}
  #minBox svg{height:110px!important}
  table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  thead, tbody{display:table}
  thead{width:100%}
  table{width:100%}
  #modal > div{width:94vw;max-height:86vh}
  #favBar{gap:4px}
  .kpi .val{font-size:22px}
  main section .grid.g4{gap:8px}
}
@media(max-width:760px){
  .bar{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:8px 10px}
  .bar::-webkit-scrollbar,nav::-webkit-scrollbar{display:none}
  .bar,nav{scrollbar-width:none;-ms-overflow-style:none}
  .bar .btn{padding:5px 9px;font-size:12px;border-radius:8px}
  .bar input{padding:5px 8px;font-size:12px;width:92px}
  section{scroll-margin-top:110px}
  .bar .btn, .bar input, .bar select{flex:0 0 auto}
  #kvSvg{height:300px;min-height:0}
  #klineMeta{display:none}
  .bar{min-width:0}
  .card,.kl,.kl>div{min-width:0}
  body{overflow-x:hidden}
}
#macd{display:none}
#klLegend{display:none}
@media(min-width:761px){#kvSvg{min-height:380px}}
</style>
</head>
<body>

<header>
  <div class="brand">缠论 · <b>缠中说禅</b></div>
  <button class="btn" id="refresh">刷新数据</button>
  <button class="btn ghost" id="scanBtn">扫描时间表</button>
  <div class="idx" id="idxBar"></div>
</header>

<nav>
  <button class="tab on" data-t="home">首页</button>
  <button class="tab" data-t="live">实盘监测</button>
  <button class="tab" data-t="pick">选股结果</button>
  <button class="tab" data-t="kline">缠论K线</button>

<main>
  <!-- 首页 -->
  <section id="home" class="on">
    <div class="grid g4" id="homeKpi"></div>
    <div class="card">
      <h3>近 10 日缠论信号 <small id="scanMeta"></small></h3>
      <div class="bd scroll" id="homeList"></div>
    </div>
  </section>

  <!-- 实盘监测（从主站搬过来） -->
  <section id="live">
    <div class="grid g4" id="lvKpi"></div>
    <div class="card">
      <h3>指数分时 <small>当日 · 每分钟</small></h3>
      <div class="bd" id="lvMinutes" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"></div>
    </div>
    <div class="grid g2" style="margin-top:12px">
      <div class="card">
        <h3>市场情绪 <small id="lvMoodMeta"></small></h3>
        <div class="bd" id="lvMood"></div>
      </div>
      <div class="card">
        <h3>A股牛熊六维 <small>综合 -100 ~ +100</small></h3>
        <div class="bd" id="lvBull"></div>
      </div>
    </div>
    <div class="grid g2" style="margin-top:12px">
      <div class="card">
        <h3>涨停池 <small id="lvZtMeta"></small></h3>
        <div class="bd scroll" id="lvZt" style="max-height:360px"></div>
      </div>
      <div class="card">
        <h3>主力净流入 TOP <small>亿元</small></h3>
        <div class="bd scroll" id="lvFlow" style="max-height:360px"></div>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <h3>临近支撑位 <small>现价距支撑 &lt; 1%</small></h3>
      <div class="bd scroll" id="lvSupport" style="max-height:320px"></div>
    </div>
  </section>

  <!-- 选股 -->
  <section id="pick">
    <div class="card">
      <div class="bar">
        <span class="pill"><span class="dot"></span>信号池</span>
        <button class="btn on" data-type="all">全部</button>
        <button class="btn" data-type="一买">一类买</button>
        <button class="btn" data-type="二买">二类买</button>
        <button class="btn" data-type="三买">三类买</button>
        <button class="btn" data-type="一卖">一类卖</button><button class="btn" data-type="二卖">二类卖</button>
        <button class="btn" data-type="三卖">三类卖</button>
        <input type="text" id="pickQ" placeholder="代码 / 名称">
        <span class="muted" id="pickCount"></span>
      </div>
      <div class="scroll" id="pickTable"></div>
    </div>
  </section>

  <!-- 缠论K线 -->
  <div id="modal" style="display:none;position:fixed;inset:0;background:rgba(3,7,18,.72);z-index:99;align-items:center;justify-content:center">
    <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--radius);width:min(760px,92vw);max-height:80vh;overflow:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)">
        <b id="modalTitle" style="font-size:13px"></b>
        <button class="btn" id="modalClose">关闭 ✕</button>
      </div>
      <div id="modalBody" style="padding:12px 14px;font-size:13px"></div>
    </div>
  </div>

  <section id="kline">
    <div class="card">
      <div class="bar">
        <span style="position:relative;display:inline-block"><input type="text" id="code" value="600031" placeholder="代码/名称" autocomplete="off" style="width:120px"><div id="codePick" style="display:none;position:absolute;left:0;top:30px;z-index:60;background:#0f172a;border:1px solid var(--line);border-radius:8px;min-width:190px;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.5)"></div></span>
        <span id="codeName" style="font-size:13px;color:#cbd5e1;font-weight:600;min-width:64px"></span>
        <button class="btn" id="loadK">分析</button>
        <button class="btn on" data-per="day">日线</button>
        <button class="btn" data-per="week">周线</button>
        <button class="btn" data-per="month">月线</button>
        <button class="btn" data-per="m60">60分</button>
        <button class="btn" data-per="m30">30分</button>
        <span style="width:10px"></span>
        <button class="btn on" data-flag="stroke">笔</button>
        <button class="btn on" data-flag="seg">线段</button>
        <button class="btn on" data-flag="pivot">中枢</button>
        <button class="btn on" data-flag="sig">买卖点</button>
        <button class="btn on" data-flag="ma">均线</button>
        <button class="btn" data-flag="chips">筹码带</button>
        <button class="btn" data-flag="flow">主力带</button>
        <button class="btn" data-flag="levels">关键位</button>
        <button class="btn" id="subBtn">副图：量</button>
        <button class="btn" id="conceptBtn">概念</button>
        <button class="btn" id="multiBtn">多级别</button>
        <button class="btn" id="helpBtn">缠论说明</button>
        <button class="btn" id="csvBtn">导出CSV</button>
        <button class="btn" id="favBtn">加自选</button>
        <span class="muted" id="klineMeta"></span>
      </div>
      <div class="bd">
        <div class="kl">
          <div>
            <div id="klWrap" style="position:relative">
              <div id="chart"></div>
              <canvas id="chipCv" style="position:absolute;left:0;top:0;pointer-events:none"></canvas>
            </div>
            <div id="minBox" style="display:none;margin-top:8px"></div>
            <div id="macd"></div>
            <div id="klLegend" style="font-size:11px;color:#8b98ad;margin-top:6px;line-height:1.6"></div>
            <div id="favBar" class="bar" style="margin-top:8px;font-size:12px"></div>
          </div>
          <div class="side">
            <div class="card" style="margin:0 0 8px">
              <h3>结构摘要</h3>
              <div class="bd" id="structBox" style="font-size:12px"></div>
            </div>
            <div class="card" style="margin:0">
              <h3>最近笔 <small id="strokeCount"></small></h3>
              <div id="strokeTable"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 回测 -->
  <section id="bt">
    <div class="grid g4" id="btKpi"></div>
    <div class="grid g2">
      <div class="card"><h3>10 日收益分布</h3><div class="bd" id="btDist"></div></div>
      <div class="card"><h3>分类型统计</h3><div class="bd" id="btType"></div></div>
    </div>
  </section>

  <!-- 大盘 -->
  <section id="market">
    <div class="grid g4" id="mkKpi"></div>
    <div class="card"><h3>市场宽度 <small>近 250 日涨跌家数</small></h3><div class="bd" id="mkBreadth" style="height:320px"></div></div>
  <div class="grid g2" id="mkBlocks" style="margin-top:12px"></div>
  </section>
</main>

<footer>缠论引擎 v1 ｜ 数据：通达信日线 · 本地扫描 ｜ <span id="ver"></span></footer>

<script type="module">
import { analyze, macd } from "./chan-engine.js";
import { scanAll } from "./chan-scan.js";

const COS = "https://amv-live-1500351250.cos.ap-guangzhou.myqcloud.com";
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const fmt = (v, n = 2) => (v == null || isNaN(v) ? "—" : (+v).toFixed(n));
const pct = (v) => (v == null || isNaN(v) ? "—" : (v > 0 ? "+" : "") + (+v).toFixed(2) + "%");
const cls = (v) => (v > 0 ? "up" : v < 0 ? "down" : "");

let SCAN = null, LIVE = null, HIST = null, BB = null;
let chart = null, macdChart = null;
let CUR = { bars: [], res: null, per: "day", flags: { stroke: 1, seg: 1, pivot: 1, sig: 1, ma: 1, chips: 0, flow: 0, levels: 0, sub: "vol" } };

// ---------- tab ----------
(function () {
  const btn = document.querySelector("#subBtn");
  if (btn) btn.addEventListener("click", () => {
    CUR.flags.sub = CUR.flags.sub === "macd" ? "vol" : "macd";
    btn.textContent = "副图：" + (CUR.flags.sub === "macd" ? "MACD" : "量");
    btn.classList.toggle("on", CUR.flags.sub === "macd");
    kvPaint();
  });
})();


const HELP_HTML = `
<style>
  .hp h4{margin:14px 0 6px;font-size:13px;color:#e2e8f0}
  .hp h4:first-child{margin-top:0}
  .hp p,.hp li{font-size:12.5px;line-height:1.75;color:#b6c2d4;margin:4px 0}
  .hp ul{padding-left:18px;margin:4px 0}
  .hp code{background:rgba(148,163,184,.16);padding:1px 5px;border-radius:4px;font-size:12px;color:#e2e8f0}
  .hp .k{display:inline-block;min-width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}
  .hp table{border-collapse:collapse;width:100%;margin:6px 0}
  .hp th,.hp td{border-bottom:1px solid rgba(148,163,184,.18);padding:4px 6px;font-size:12px;text-align:left;color:#b6c2d4}
  .hp th{color:#8b98ad;font-weight:500}
</style>
<div class="hp">
  <h4>一、这张图在看什么</h4>
  <p>缠论只做一件事：<b>把价格走势拆成有级别的结构</b>，然后等结构走完（背驰）时找买卖点。图上四层东西，从粗到细：</p>
  <table>
    <tr><th>图层</th><th>图上样子</th><th>含义</th></tr>
    <tr><td>线段</td><td>紫色粗虚线</td><td>比笔更大的方向，一段通常含 3 笔以上</td></tr>
    <tr><td>笔</td><td>橙色折线</td><td>相邻顶底分型之间的最小走势单位</td></tr>
    <tr><td>中枢</td><td>蓝色方框</td><td>连续三笔重叠的价格区间，多空反复争夺的地方</td></tr>
    <tr><td>买卖点</td><td>红/绿圆点 + 文字</td><td>一买/二买/三买（红），一卖/二卖/三卖（绿）</td></tr>
  </table>

  <h4>二、四类结构怎么判定（页面口径）</h4>
  <ul>
    <li><b>分型</b>：三根合并 K 线，中间那根高点最高=顶分型，低点最低=底分型。</li>
    <li><b>笔</b>：顶分型 → 底分型（或反向）且中间至少隔 4 根合并 K 线，顶底交替出现。</li>
    <li><b>线段</b>：用「特征序列」找终结 —— 上升段里取所有下跌笔，若某一笔高点同时高于左右两笔，该段结束。</li>
    <li><b>中枢</b>：连续三笔的重叠区间 <code>[ZD, ZG]</code>，<code>ZG=三笔高点最小值</code>、<code>ZD=三笔低点最大值</code>；后续笔仍落在区间内就继续延伸，跑出去即「离开笔」。</li>
  </ul>

  <h4>三、买卖点是怎么算出来的</h4>
  <ul>
    <li><b>一买</b>：下跌线段出现<b>背驰</b> —— 当前段幅度变小，且 MACD 面积也变小（<code>幅度 &lt; 前段×0.9 且 面积 &lt; 前段×0.85</code>），说明跌势衰竭。</li>
    <li><b>二买</b>：一买之后第一次回调，<b>不破</b>一买低点。</li>
    <li><b>三买</b>：价格离开中枢向上后回抽，<b>不跌回 ZG</b>（中枢上沿），强势确认。</li>
    <li>卖点完全对称：一卖=上涨背驰，二卖=反弹不破一卖高点，三卖=跌破 ZD 后反抽不回中枢。</li>
  </ul>
  <p>⚠️ 一买依赖背驰，背驰用「幅度 × MACD 面积」比较相邻同向段 —— 这是<b>近似口径</b>，不是缠论原教旨的区间套递归。</p>

  <h4>四、按钮都干什么</h4>
  <table>
    <tr><th>按钮</th><th>作用</th></tr>
    <tr><td>日线/周线/月线/60分/30分</td><td>切换周期重算结构与信号；周月线由日线聚合，60/30 分取分钟数据</td></tr>
    <tr><td>笔 / 线段 / 中枢 / 买卖点</td><td>图层开关，各自独立</td></tr>
    <tr><td>均线</td><td>MA5/10/20/60</td></tr>
    <tr><td>筹码带</td><td>按可见区间的成交量做 20 档分布：<span class="k" style="background:#3b82f6"></span>蓝=核心(≥66%峰)、<span class="k" style="background:#94a3b8"></span>灰=边缘，虚线是 POC（最密价位）</td></tr>
    <tr><td>主力带</td><td>同上，但权重换成主力净流入（东财口径，近似 L2），只画净流入为正的档</td></tr>
    <tr><td>关键位</td><td>最近 250 根的摆动高低点：红=压力带、绿=支撑带、蓝=最近 120 根最高价（突破线）</td></tr>
    <tr><td>副图</td><td><b>量</b>=成交量；<b>MACD</b>=柱+DIF+DEA，和背驰用的是同一份数据</td></tr>
    <tr><td>概念</td><td>该股所属行业板块与当日涨跌（数据来自主站 app-data.js 的 sector_members）</td></tr>
    <tr><td>多级别</td><td>日线/60分/30分 三级别各自有多少笔、段、中枢、信号，现价在哪个级别中枢里</td></tr>
    <tr><td>导出CSV</td><td>把当前周期 K 线导出成 csv</td></tr>
    <tr><td>加自选</td><td>存到浏览器本地（localStorage），点标签直接切股票</td></tr>
  </table>

  <h4>五、读图顺序（建议）</h4>
  <ol>
    <li>先看<b>线段方向</b>：紫虚线朝上还是朝下，决定只找买点还是只找卖点。</li>
    <li>再看<b>中枢位置</b>：现价在中枢上方=强势，内部=震荡，下方=弱势。</li>
    <li>打开<b>MACD 副图</b>：当前段和上一段同向段比，柱面积是不是明显缩小（背驰）。</li>
    <li>等<b>信号点</b>出现：一买最凶但最容易失败，三买最稳但位置最高。</li>
    <li>最后用<b>筹码带 POC / 关键位</b>定止损：跌回中枢 ZG 下方、或跌破 POC，信号作废。</li>
  </ol>

  <h4>六、操作</h4>
  <ul>
    <li>滚轮 = 缩放（20~500 根）；按住拖动 = 平移；双击 = 回到最近 250 根</li>
    <li>鼠标移动 = 十字光标（日期 + OHLC + 涨跌幅 + 成交量）</li>
    <li>点某根蜡烛 = 下方显示该日分时（只有精选池 124 只有分钟数据）</li>
    <li>手机：双指捏合缩放，单指拖动平移</li>
  </ul>

  <h4>七、已知局限（别当圣杯）</h4>
  <ul>
    <li>筹码带是<b>日线成交量近似</b>，不是逐笔成本分布；主力带是东财日频净额代理，不是 L2。</li>
    <li>背驰用「幅度 × MACD 面积」，没有做区间套递归，极端行情会误报。</li>
    <li>信号是<b>结构识别</b>，不是回测过的策略；全市场回测里二买/三买胜率约 60%、均收益 3~4%，一买只有 57%，且未扣成本。</li>
    <li>60/30 分只有精选池有数据，其余股票会提示「无数据」。</li>
    <li>概念只有行业分类（56 个板块），没有题材概念库。</li>
  </ul>
</div>`;

function sparkline(points, w = 300, h = 90) {
  if (!points || points.length < 2) return '<div class="muted" style="padding:12px">无分时</div>';
  const ys = points.map((p) => p[1]);
  const min = Math.min(...ys), max = Math.max(...ys);
  const span = max - min || 1;
  const step = w / (points.length - 1);
  const d = points.map((p, i) => `${i ? "L" : "M"}${(i * step).toFixed(1)},${(h - ((p[1] - min) / span) * (h - 8) - 4).toFixed(1)}`).join("");
  const up = ys[ys.length - 1] >= ys[0];
  const color = up ? "#ef4444" : "#22c55e";
  const last = points[points.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:92px;display:block">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.4"/>
    <text x="2" y="10" fill="#8b98ad" font-size="9">${min.toFixed(2)}</text>
    <text x="2" y="${h - 2}" fill="#8b98ad" font-size="9">${max.toFixed(2)}</text>
    <text x="${w - 34}" y="10" fill="#8b98ad" font-size="9">${last[0]}</text>
  </svg>`;
}

function renderMarket() {
  const box = $("#mkKpi");
  if (!LIVE) { box.innerHTML = '<div class="card"><div class="bd muted">行情数据加载失败</div></div>'; return; }
  const t = LIVE.breadth || {};
  const amt = t.amount_sum ? (t.amount_sum / 1e12).toFixed(2) + " 万亿" : "—";
  const cards = [
    ["上涨家数", t.up ?? "—", "up"],
    ["下跌家数", t.down ?? "—", "down"],
    ["涨停 / 跌停", (t.limit_up ?? "—") + " / " + (t.limit_down ?? "—"), ""],
    ["两市成交额", amt, ""],
  ];
  box.innerHTML = cards
    .map(([l, v, c]) => `<div class="card kpi"><div class="bd"><div class="lab">${l}</div>
      <div class="val ${c}">${v}</div></div></div>`)
    .join("");

  // 市场宽度（近 250 日涨跌家数）
  // 板块强度 TOP10（先画，避免等宽度数据）
  const blocks = (LIVE.blocks || []).filter((b) => b && b.name && typeof b.pct === "number");
  const row = (b) => `<tr><td>${b.name}</td><td class="muted">${b.type || ""}</td>
    <td class="${b.pct >= 0 ? "up" : "down"} tabular-nums">${b.pct >= 0 ? "+" : ""}${b.pct.toFixed(2)}%</td>
    <td class="tabular-nums">${b.n ?? b.total ?? ""}</td></tr>`;
  const tbl = (title, list) => `<div class="card"><div class="hd">${title}</div>
    <div class="bd" style="padding:0"><table><thead><tr><th>板块</th><th>类型</th><th>涨跌幅</th><th>成分</th></tr></thead>
    <tbody>${list.map(row).join("")}</tbody></table></div></div>`;
  const wrap = $("#mkBlocks");
  if (wrap && blocks.length) {
    const top = [...blocks].sort((a, b) => b.pct - a.pct).slice(0, 10);
    const bot = [...blocks].sort((a, b) => a.pct - b.pct).slice(0, 10);
    wrap.innerHTML = tbl("板块领涨 TOP10", top) + tbl("板块领跌 TOP10", bot);
  }

  const hist = (HIST && HIST.history) || [];
  const el = $("#mkBreadth");
  if (!hist.length) { el.innerHTML = '<div class="muted" style="padding:16px">宽度历史加载中…</div>'; return; }
  // 用自绘 SVG 画宽度柱（不依赖 echarts 实例，避免 canvas 被重建后空白）
  const arr = hist.slice(-250);
  const W = 1000, H = 300, mid = H / 2, pad = 6;
  const maxV = Math.max(1, ...arr.map((x) => Math.max(x.up || 0, x.down || 0)));
  const bw = (W - pad * 2) / arr.length;
  let bars = "";
  arr.forEach((x, i) => {
    const upH = ((x.up || 0) / maxV) * (mid - 8);
    const dnH = ((x.down || 0) / maxV) * (mid - 8);
    const px = pad + i * bw;
    bars += `<rect x="${px.toFixed(1)}" y="${(mid - upH).toFixed(1)}" width="${Math.max(1, bw - 0.8).toFixed(1)}" height="${upH.toFixed(1)}" fill="#ef4444" opacity=".85"/>`;
    bars += `<rect x="${px.toFixed(1)}" y="${mid}" width="${Math.max(1, bw - 0.8).toFixed(1)}" height="${dnH.toFixed(1)}" fill="#22c55e" opacity=".85"/>`;
  });
  const last = arr[arr.length - 1] || {};
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:320px;display:block">
    <line x1="0" y1="${mid}" x2="${W}" y2="${mid}" stroke="rgba(148,163,184,.35)" stroke-width="1"/>
    ${bars}
  </svg>
  <div class="muted" style="font-size:12px;padding:6px 10px">
    ${arr[0].date} ~ ${last.date} ｜ 最新：涨 ${last.up} / 跌 ${last.down}
  </div>`;
}
function emSecid(code) {
  // 东财：1=沪 0=深/北
  return (/^(6|9)/.test(code) ? '1.' : '0.') + code;
}
const KLT = { day: 101, week: 102, month: 103, m60: 60, m30: 30 };
async function fromMinuteP7(code, stepMin) {
  // 用 p7 分钟数据聚合出 30/60 分 K（只有精选池 124 只有）
  const out = [];
  const today = new Date();
  for (let back = 0; back < 40 && out.length < 300; back++) {
    const dd = new Date(today.getTime() - back * 86400000);
    const ymd = `${dd.getFullYear()}${String(dd.getMonth() + 1).padStart(2, "0")}${String(dd.getDate()).padStart(2, "0")}`;
    let j;
    try { j = await (await fetch(`${COS}/minute/${code}/${ymd}/p7.json?t=1`)).json(); } catch (e) { continue; }
    const bars = (j && j.bars) || [];
    for (let i = 0; i < bars.length; i += stepMin) {
      const chunk = bars.slice(i, i + stepMin).filter((b) => b && isFinite(b.c));
      if (!chunk.length) continue;
      out.push({
        d: ymd.slice(0, 4) + "-" + ymd.slice(4, 6) + "-" + ymd.slice(6) + " " + (chunk[0].t || ""),
        o: chunk[0].o, c: chunk[chunk.length - 1].c,
        h: Math.max(...chunk.map((b) => b.h)), l: Math.min(...chunk.map((b) => b.l)),
        v: chunk.reduce((s, b) => s + (b.vol || 0), 0),
      });
    }
  }
  return out.sort((a, b) => (a.d < b.d ? -1 : 1));
}

async function fetchBars(code, per = 'day') {
  // ① 优先读 COS 上的本地 dump（信号池股票都有，日线）
  if (per === 'day') {
    try {
      const j = await (await fetch(COS + "/chan/" + code + ".json?t=" + Date.now())).json();
      if (j && j.bars && j.bars.length > 100) {
        return j.bars.map((r) => ({ d: r[0], o: r[1], c: r[2], h: r[3], l: r[4], v: r[5] }));
      }
    } catch (e) { /* 没有就落到东财 */ }
  }
  // ② 30/60 分：先东财，失败回退分钟聚合
  if (per === "m60" || per === "m30") {
    const step = per === "m60" ? 60 : 30;
    try {
      const klt = KLT[per];
      const u = "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=" + emSecid(code)
        + "&klt=" + klt + "&fqt=1&beg=0&end=20500101"
        + "&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57&_=" + Date.now();
      const jj = await (await fetch(u)).json();
      const kk = jj?.data?.klines || [];
      if (kk.length > 30) {
        return kk.map((s) => {
          const [d, o, c, h, l, v] = s.split(',');
          return { d, o: +o, c: +c, h: +h, l: +l, v: +v };
        });
      }
    } catch (e) { /* 落回聚合 */ }
    const agg = await fromMinuteP7(code, step);
    if (agg.length) return agg;
    throw new Error("no minute data");
  }
  // ③ 东财
  const klt = KLT[per] || 101;
  const u = "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=" + emSecid(code)
    + "&klt=" + klt + "&fqt=1&beg=0&end=20500101"
    + "&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57&_=" + Date.now();
  const j = await (await fetch(u)).json();
  const k = j?.data?.klines || [];
  return k.map((s) => {
    const [d, o, c, h, l, v] = s.split(',');
    return { d, o: +o, c: +c, h: +h, l: +l, v: +v };
  });
}
function toWeek(bars) {
  const out = [];
  for (const b of bars) {
    const dt = new Date(b.d);
    const key = `${dt.getFullYear()}W${Math.ceil((((dt - new Date(dt.getFullYear(), 0, 1)) / 86400000) + 1) / 7)}`;
    const last = out[out.length - 1];
    if (last && last.key === key) {
      last.h = Math.max(last.h, b.h); last.l = Math.min(last.l, b.l); last.c = b.c; last.v += b.v;
    } else out.push({ key, d: b.d, o: b.o, c: b.c, h: b.h, l: b.l, v: b.v });
  }
  return out;
}

function toMonth(bars) {
  const out = [];
  for (const b of bars) {
    const key = String(b.d).slice(0, 7);
    const last = out[out.length - 1];
    if (last && last.key === key) {
      last.h = Math.max(last.h, b.h); last.l = Math.min(last.l, b.l); last.c = b.c; last.v += b.v;
    } else out.push({ key, d: b.d, o: b.o, c: b.c, h: b.h, l: b.l, v: b.v });
  }
  return out;
}

async function loadKline(code) {
  $("#klineMeta").textContent = "加载中…";
  let bars;
  const wantWeek = CUR.per === "week", wantMonth = CUR.per === "month";
  try { bars = await fetchBars(code, wantWeek || wantMonth ? "day" : CUR.per); }
  catch { $("#klineMeta").textContent = CUR.per === "m60" || CUR.per === "m30" ? "该股没有分钟数据" : "拉取失败"; return; }
  if (wantWeek) bars = toWeek(bars);
  else if (wantMonth) bars = toMonth(bars);
  if (!bars.length) { $("#klineMeta").textContent = "无数据（北交所暂不支持）"; return; }
  const per = CUR.per;
  const use = bars;
  const res = analyze(use);
  CUR.bars = use; CUR.res = res;
  // 切周期后必须回到最新一根，否则会停在上一周期留下的位置上
  KV.end = use.length - 1;
  KV.count = Math.min(KV.count || 150, use.length);
  loadFlow(code);
  setCodeName(code);
  const nm = (NAMES && NAMES[code]) || "";
  $("#klineMeta").textContent = `${code} ${nm} ｜ ${use.length} 根 ｜ 笔 ${res.sl.length} ｜ 段 ${res.segs.length} ｜ 中枢 ${res.pivots.length} ｜ 信号 ${res.sig.length}`;
  drawSVG(use, res);

  const lg = document.querySelector("#klLegend");
  const perName = { day: "日K", week: "周K", month: "月K", m60: "60分", m30: "30分" }[per] || "日K";
  if (lg) lg.innerHTML = perName + "（前复权）｜橙 MA5 · 蓝 MA10 · 紫 MA20 · 紫 MA60 ｜ "
    + "<span style='color:#ef4444'>红=压力带</span> · <span style='color:#22c55e'>绿=支撑带</span> · "
    + "<span style='color:#38bdf8'>蓝=突破线</span> ｜ 筹码带：<span style='color:#3b82f6'>蓝=核心(≥66%峰)</span> "
    + "<span style='color:#94a3b8'>灰=边缘</span>，POC=最密档 ｜ 主力带：<span style='color:#8b5cf6'>紫</span>";
}

function ma(arr, n) {
  const out = new Array(arr.length).fill(null);
  let sum = 0;
  for (let i = 0; i < arr.length; i++) {
    sum += arr[i];
    if (i >= n) sum -= arr[i - n];
    if (i >= n - 1) out[i] = +(sum / n).toFixed(3);
  }
  return out;
}

function keyLevels(bars) {
  // 最近 250 根里的摆动高低点 + 20/60 日均线，取离现价最近的上下各两条
  const n = bars.length, i0 = Math.max(0, n - 250);
  const c = bars[n - 1].c;
  const highs = [], lows = [];
  for (let i = i0 + 2; i < n - 2; i++) {
    const b = bars[i];
    if (b.h >= bars[i - 1].h && b.h >= bars[i - 2].h && b.h >= bars[i + 1].h && b.h >= bars[i + 2].h) highs.push(b.h);
    if (b.l <= bars[i - 1].l && b.l <= bars[i - 2].l && b.l <= bars[i + 1].l && b.l <= bars[i + 2].l) lows.push(b.l);
  }
  const above = [...new Set(highs.filter((x) => x > c * 1.005).map((x) => +x.toFixed(2)))]
    .sort((a, b) => a - b).slice(0, 2);
  const below = [...new Set(lows.filter((x) => x < c * 0.995).map((x) => +x.toFixed(2)))]
    .sort((a, b) => b - a).slice(0, 1);
  return [
    ...above.map((p, i) => ({ p, t: "压力" + (i + 1), k: "up" })),
    ...below.map((p, i) => ({ p, t: "支撑" + (i + 1), k: "down" })),
  ];
}

function draw(bars, r) {
  if (!bars || !bars.length) return;
  if (!document.querySelector("#chart")) return; // 已切到手写 SVG，旧 echarts 流程停用
  if (document.querySelector("#kline").offsetParent === null) return; // 分区不可见时跳过（避免 0 尺寸初始化）
  const dates = bars.map((b) => b.d);
  const ohlc = bars.map((b) => [b.o, b.c, b.l, b.h]);
  const idx = new Map(dates.map((d, i) => [d, i]));
  const f = CUR.flags;

  chart = chart || echarts.init($("#chart"));
  macdChart = macdChart || echarts.init($("#macd"));
  if (!chart.__chipHooked) {
    chart.__chipHooked = true;
    chart.on("rendered", drawChipOverlay);
    chart.on("datazoom", drawChipOverlay);

    // 主图 / 副图 缩放联动（旧页面是同一套视图，这里保持一致）
    let syncing = false;
    const syncZoom = (from, to) => {
      if (syncing) return;
      syncing = true;
      try {
        const dz = (from.getOption().dataZoom || [{}])[0] || {};
        const n = CUR.bars.length || 1;
        let s = dz.start ?? 0, e = dz.end ?? 100;
        const span = ((e - s) / 100) * n;
        if (span < 20) { e = Math.min(100, s + (20 / n) * 100); }
        if (span > 500) { e = s + (500 / n) * 100; }
        to.dispatchAction({ type: "dataZoom", start: s, end: e });
      } catch (err) { /* ignore */ }
      syncing = false;
    };
    chart.on("dataZoom", () => { syncZoom(chart, macdChart); drawChipOverlay(); });
    macdChart.on("dataZoom", () => syncZoom(macdChart, chart));

    // 双击复位到最近 250 根
    chart.getZr().on("dblclick", () => {
      const n = CUR.bars.length || 1;
      const s = Math.max(0, 100 - (250 / n) * 100);
      chart.dispatchAction({ type: "dataZoom", start: s, end: 100 });
      macdChart.dispatchAction({ type: "dataZoom", start: s, end: 100 });
    });
    chart.getZr().on("click", (e) => {
      // 空白处也能点：把像素反算成 K 线下标
      let i = null;
      try {
        const pt = chart.convertFromPixel({ gridIndex: 0 }, [e.offsetX, e.offsetY]);
        if (pt) i = Math.round(pt[0]);
      } catch (err) { /* ignore */ }
      if (i == null || isNaN(i)) return;
      const b = CUR.bars[Math.max(0, Math.min(CUR.bars.length - 1, i))];
      if (b) showMinute(b.d);
    });
  }

  // 笔：连续折线（每笔终点即下一笔起点）
  const strokePts = r.sl.map((s) => [s.d1, s.p1]);
  const segPts = r.segs.map((s) => [s.d1, s.p1]);
  const sigPts = r.sig.map((s) => ({ value: [s.d, s.p], name: s.type }));

  const series = [
    {
      name: "K线", type: "candlestick", data: ohlc,
      itemStyle: { color: "#ef4444", color0: "#22c55e", borderColor: "#ef4444", borderColor0: "#22c55e" },
      markArea: (f.pivot || f.levels)
        ? {
            silent: true,
            label: { show: false },
            data: [
              ...(f.pivot
                ? r.pivots.slice(-8).map((pv) => [
                    { xAxis: pv.d0, yAxis: +pv.zd.toFixed(2), itemStyle: { color: "rgba(99,102,241,.10)", borderColor: "rgba(99,102,241,.45)", borderWidth: 1 } },
                    { xAxis: pv.d1, yAxis: +pv.zg.toFixed(2) },
                  ])
                : []),
              ...(f.levels
                ? keyLevels(bars).map((l) => [
                    { yAxis: l.k === "up" ? l.p : +(l.p * 0.985).toFixed(2), itemStyle: { color: l.k === "up" ? "rgba(239,68,68,.12)" : "rgba(34,197,94,.12)" } },
                    { yAxis: l.k === "up" ? +(l.p * 1.015).toFixed(2) : l.p },
                  ])
                : []),
            ],
          }
        : undefined,
      markLine: f.levels
        ? {
            silent: true, symbol: "none",
            label: { show: false },
            data: [
              ...keyLevels(bars).map((l) => ({
                name: `${l.t} ${l.p.toFixed(2)}`,
                yAxis: +l.p.toFixed(2),

                label: { position: l.k === "up" ? "end" : "start" },
              })),
              (() => {
                const hi = Math.max(...bars.slice(-120).map((b) => b.h));
                return {
                  name: `突破 ${hi.toFixed(2)}`,
                  yAxis: +hi.toFixed(2),
                  lineStyle: { color: "#38bdf8", type: "solid", width: 1 },
                };
              })(),
            ],
          }
        : undefined,
    },
  ];

  if (f.ma) {
    ["5", "10", "20", "60"].forEach((n, i) => {
      series.push({
        name: "MA" + n, type: "line", data: ma(bars.map((b) => b.c), +n), smooth: true, showSymbol: false,
        lineStyle: { width: 1, color: ["#f59e0b", "#60a5fa", "#a78bfa", "#34d399"][i], opacity: 0.85 }, z: 3,
      });
    });
  }
  if (f.stroke) {
    series.push({
      name: "笔", type: "line", data: dates.map((d) => { const k = strokePts.find((p) => p[0] === d); return k ? k[1] : null; }),
      connectNulls: true, showSymbol: true, symbolSize: 4, z: 6,
      lineStyle: { width: 1.4, color: "#f59e0b" }, itemStyle: { color: "#f59e0b" },
    });
  }
  if (f.seg) {
    series.push({
      name: "线段", type: "line", data: dates.map((d) => { const k = segPts.find((p) => p[0] === d); return k ? k[1] : null; }),
      connectNulls: true, showSymbol: false, z: 7,
      lineStyle: { width: 2.4, color: "#a78bfa", type: "dashed" },
    });
  }
  if (f.sig) {
    series.push({
      name: "买卖点", type: "scatter", data: sigPts, symbolSize: 9, z: 8,
      itemStyle: { color: (p) => (p.data.name.includes("买") ? "#f87171" : "#34d399") },
      label: {
        show: true, formatter: (p) => p.data.name, position: "top", fontSize: 10,
        color: "#e6ebf3", backgroundColor: "rgba(10,14,21,.8)", padding: [1, 3], borderRadius: 3,
      },
    });
  }

  chart.setOption(
    {
      animation: false,
      backgroundColor: "transparent",
      grid: { left: 52, right: f.levels ? 176 : (f.chips || f.flow ? 132 : 16), top: 20, bottom: 26 },
      tooltip: {
        trigger: "axis", axisPointer: { type: "cross", crossStyle: { color: "#3b475c" } },
        backgroundColor: "rgba(15,22,34,.95)", borderColor: "#243044", textStyle: { color: "#e6ebf3", fontSize: 12 },
        formatter: (ps) => {
          const p = ps.find((x) => x.seriesName === "K线") || ps[0];
          if (!p) return "";
          const b = bars[p.dataIndex];
          const dif = r.md.dif[p.dataIndex], dea = r.md.dea[p.dataIndex];
          const st = r.sig.filter((s) => Math.abs((idx.get(s.d) ?? -99) - p.dataIndex) <= 2);
          return `<b>${b.d}</b><br/>开 ${fmt(b.o)} 高 ${fmt(b.h)}<br/>低 ${fmt(b.l)} 收 ${fmt(b.c)}<br/>
            DIF ${fmt(dif, 3)} DEA ${fmt(dea, 3)}<br/>
            ${st.map((s) => `${s.type} @${fmt(s.p)}`).join("<br/>")}`;
        },
      },
      xAxis: {
        type: "category", data: dates, boundaryGap: true,
        axisLine: { lineStyle: { color: "#2a3446" } },
        axisLabel: { color: "#8b98ad", fontSize: 11 },
        splitLine: { show: false },
      },
      yAxis: {
        scale: true, axisLabel: { color: "#8b98ad", fontSize: 11 },
        splitLine: { lineStyle: { color: "rgba(148,163,184,.10)" } },
      },
      dataZoom: [
        { type: "inside", zoomOnMouseWheel: true, moveOnMouseMove: true, moveOnMouseWheel: false,
          start: Math.max(0, 100 - (250 / bars.length) * 100), end: 100 },
      ],
      series,
    },
    true
  );

  // MACD 副图
  macdChart.setOption(
    {
      animation: false, backgroundColor: "transparent",
      grid: { left: 52, right: 16, top: 8, bottom: 20 },
      xAxis: { type: "category", data: dates, axisLabel: { show: false }, axisLine: { lineStyle: { color: "#2a3446" } } },
      yAxis: { scale: true, axisLabel: { color: "#8b98ad", fontSize: 10 }, splitLine: { lineStyle: { color: "rgba(148,163,184,.08)" } } },
      dataZoom: [{ type: "inside", zoomOnMouseWheel: true, moveOnMouseMove: true, moveOnMouseWheel: false,
          start: Math.max(0, 100 - (250 / bars.length) * 100), end: 100 }],
      series: [
        { name: "MACD", type: "bar", data: r.md.hist.map((v) => +v.toFixed(3)), itemStyle: { color: (p) => (p.value >= 0 ? "#ef4444" : "#22c55e") }, barMaxWidth: 4 },
        { name: "DIF", type: "line", data: r.md.dif.map((v) => +v.toFixed(3)), showSymbol: false, lineStyle: { width: 1, color: "#f59e0b" } },
        { name: "DEA", type: "line", data: r.md.dea.map((v) => +v.toFixed(3)), showSymbol: false, lineStyle: { width: 1, color: "#60a5fa" } },
      ],
      tooltip: { trigger: "axis" },

}

function drawStruct(bars, r) {
  const last = bars[bars.length - 1];
  const seg = r.segs[r.segs.length - 1];
  const pv = r.pivots[r.pivots.length - 1];
  const sig = r.sig[r.sig.length - 1];

      <span class="muted">当前段</span><b>${seg ? (seg.dir === 1 ? "向上" : "向下") + `（${seg.strokes} 笔${seg.open ? " · 未完成" : ""}）` : "—"}</b>
      <span class="muted">段区间</span><span>${seg ? fmt(seg.lo) + " ~ " + fmt(seg.hi) : "—"}</span>
      <span class="muted">最近中枢</span><span>${pv ? fmt(pv.zd) + " ~ " + fmt(pv.zg) + (last.c > pv.zg ? "（上方）" : last.c < pv.zd ? "（下方）" : "（内部）") : "—"}</span>
      <span class="muted">最近信号</span><span>${sig ? `${tag(sig.type)} ${sig.d} @${fmt(sig.p)}` : "—"}</span>

    </tbody></table>`;
}

async function resolveCode(q) {
  q = (q || "").trim();
  if (!q) return null;
  if (/^\d{6}$/.test(q)) return q;
  const m6 = q.match(/\d{6}/);
  if (m6) return m6[0];
  const m = (await loadNames()) || {};
  const hit = [];
  for (const [c, n] of Object.entries(m)) {
    if (!n) continue;
    if (n.includes(q) || n.replace(/\s/g, "").includes(q)) hit.push({ c, n });
    if (hit.length >= 40) break;
  }
  if (hit.length === 1) return hit[0].c;
  if (hit.length > 1) { showCodePick(hit, q); return null; }
  return null;
}

function showCodePick(list, q) {
  const box = $("#codePick");
  if (!box) return;
  box.innerHTML = list.slice(0, 12).map((x) =>

function chipsFor(bars, i0, i1, M, flowMap) {
  M = M || 40;
  if (!bars || i1 <= i0) return null;
  let hh = -Infinity, ll = Infinity;
  for (let i = i0; i <= i1; i++) {
    if (bars[i].h > hh) hh = bars[i].h;
    if (bars[i].l < ll) ll = bars[i].l;
  }
  if (!(hh > ll) || !(ll > 0)) return null;
  const R = hh / ll;
  const bound = (j) => ll * Math.pow(R, j / M);
  const dens = new Array(M).fill(0);
  for (let i = i0; i <= i1; i++) {
    const b = bars[i];
    let v = b.v;
    if (flowMap) {
      const fv = flowMap[b.d];
      v = fv ? Math.max(0, +fv[0]) : 0;      // 主力模式：只取净流入为正的部分
    }
    if (!isFinite(v) || v <= 0) continue;
    const h = b.h, l = b.l;
    if (!(h > l)) {
      let j = Math.floor((Math.log(l / ll) / Math.log(R)) * M);
      j = Math.max(0, Math.min(M - 1, j));
      dens[j] += v;
      continue;
    }
    let j0 = Math.floor((Math.log(l / ll) / Math.log(R)) * M);
    let j1 = Math.floor((Math.log(h / ll) / Math.log(R)) * M);
    j0 = Math.max(0, Math.min(M - 1, j0));
    j1 = Math.max(0, Math.min(M - 1, j1));
    const n = j1 - j0 + 1;
    for (let j = j0; j <= j1; j++) dens[j] += v / n;
  }
  const mx = Math.max(...dens) || 1;
  return dens.map((w, j) => ({ p0: bound(j), p1: bound(j + 1), w: w / mx }));
}

function drawChipOverlay() {
  const cv = document.querySelector("#chipCv");
  const host = document.querySelector("#chart");
  if (!cv || !host || !chart) return;
  const on = CUR.flags.chips || CUR.flags.flow;
  const dpr = window.devicePixelRatio || 1;
  const w = host.clientWidth, h = host.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) {
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + "px"; cv.style.height = h + "px";
  }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  if (!on || !CUR.bars.length) return;

  let rect;
  try { rect = chart.getModel().getComponent("grid").coordinateSystem.getRect(); } catch (e) { return; }
  if (!rect) return;
  const dz = (chart.getOption().dataZoom || [{}])[0] || {};
  const n = CUR.bars.length;
  const i0 = Math.max(0, Math.floor(((dz.start ?? 0) / 100) * n));
  const i1 = Math.min(n - 1, Math.ceil(((dz.end ?? 100) / 100) * n) - 1);
  const flowMap = CUR.flags.flow && FLOW ? FLOW.days : null;
  const bins = chipsFor(CUR.bars, i0, i1, 44, flowMap);
  if (!bins) return;

  const gx = rect.x + rect.width + 8;
  const maxW = Math.max(36, Math.min(CUR.flags.levels ? 104 : 112, host.clientWidth - gx - (CUR.flags.levels ? 62 : 6)));
  const peak = bins.reduce((a, b) => (b.w > a.w ? b : a), bins[0]);
  bins.forEach((b) => {
    const y0 = chart.convertToPixel({ yAxisIndex: 0 }, b.p0);
    const y1 = chart.convertToPixel({ yAxisIndex: 0 }, b.p1);
    if (y0 == null || y1 == null) return;
    const top = Math.min(y0, y1), hh = Math.max(1, Math.abs(y1 - y0) - 0.6);
    if (top < rect.y - 2 || top > rect.y + rect.height) return;
    const bw = Math.max(0.6, b.w * maxW);
    if (CUR.flags.flow) {
      g.fillStyle = "rgba(139,92,246,.60)";                 // 主力带：紫（缺数据时自动直连东财）
    } else {
      g.fillStyle = b.w >= 0.66 ? "rgba(59,130,246,.80)"     // 核心区 ≥66% 峰
                                : "rgba(148,163,184,.32)";   // 边缘
    }
    g.fillRect(gx, top, bw, hh);
  });
  // 关键位文字（画在最右侧留白，自动避让重叠）
  if (CUR.flags.levels) {
    const labels = [];
    keyLevels(CUR.bars).forEach((l) => {
      const yy = chart.convertToPixel({ yAxisIndex: 0 }, l.p);
      if (yy == null || yy < rect.y + 8 || yy > rect.y + rect.height - 4) return;
      labels.push({ y: yy, text: l.t + " " + l.p.toFixed(2), color: l.k === "up" ? "#fca5a5" : "#86efac" });
    });
    const hi = Math.max(...CUR.bars.slice(-120).map((b) => b.h));
    const yh = chart.convertToPixel({ yAxisIndex: 0 }, hi);
    if (yh != null && yh > rect.y && yh < rect.y + rect.height) {
      labels.push({ y: yh - 4, text: "突破 " + hi.toFixed(2), color: "#7dd3fc" });
    }
    labels.sort((a, b) => a.y - b.y);
    for (let i = 1; i < labels.length; i++) {
      if (labels[i].y - labels[i - 1].y < 13) labels[i].y = labels[i - 1].y + 13;
    }
    g.font = "10px system-ui, sans-serif";
    labels.forEach((l) => {
      g.fillStyle = l.color;
      g.fillText(l.text, host.clientWidth - 62, l.y + 3);
    });
  }

  // POC：最密档中心
  const py = chart.convertToPixel({ yAxisIndex: 0 }, (peak.p0 + peak.p1) / 2);
  if (py != null && py > rect.y && py < rect.y + rect.height) {
    g.strokeStyle = "rgba(147,197,253,.85)";
    g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(gx, py); g.lineTo(gx + maxW, py); g.stroke();
    g.setLineDash([]);
    g.fillStyle = "#93c5fd";
    g.font = "10px system-ui, sans-serif";
    g.fillText("POC " + ((peak.p0 + peak.p1) / 2).toFixed(2), gx + 2, rect.y + rect.height - 6);
  }
}

function flowSecId(code) {

async function fetchFlowDirect(code) {
  const u = "https://push2his.eastmoney.com/api/qt/stock/fflow/daykline/get"
    + "?lmt=0&klt=101&secid=" + flowSecId(code)
    + "&fields1=f1,f2,f3,f7&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61";
  const j = await (await fetch(u, { cache: "no-store" })).json();
  const kl = (j && j.data && j.data.klines) || [];
  const days = {};
  for (const s of kl) {
    const a = String(s).split(",");
    if (a.length < 6) continue;
    days[a[0]] = [+a[1] || 0, (+a[5] || 0) + 0.2 * (+a[4] || 0)];

  return Object.keys(days).length ? days : null;
}

  if (!j || !j.days) return true;
  const t = Date.parse(String(j.updated_at || "").replace(/-/g, "/"));
  if (!isFinite(t)) return true;
  return Date.now() - t > 3 * 86400000;
}

// ---------- 双指缩放（手机） ----------
(function pinchZoom() {
  if (document.querySelector("#kvSvg")) return; // 已改用 SVG 版手势，旧逻辑停用
  const wrap = document.querySelector("#klWrap");
  if (!wrap) return;
  const dist = (e) => {
    const a = e.touches[0], b = e.touches[1];
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1;
  };
  const zoom = () => {
    const dz = (chart && chart.getOption().dataZoom || [{}])[0] || {};
    return { start: dz.start ?? 0, end: dz.end ?? 100 };
  };
  let p0 = null;
  wrap.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) { p0 = { d: dist(e), z: zoom() }; }
  }, { passive: true });
  wrap.addEventListener("touchmove", (e) => {
    if (!p0 || e.touches.length !== 2 || !chart) return;
    e.preventDefault();
    const n = CUR.bars.length || 1;
    const curSpan = ((p0.z.end - p0.z.start) / 100) * n;
    const want = Math.max(20, Math.min(500, curSpan * (p0.d / dist(e))));
    const mid = (p0.z.start + p0.z.end) / 2;
    const half = (want / n) * 50;
    const start = Math.max(0, Math.min(100 - half * 2, mid - half));
    chart.dispatchAction({ type: "dataZoom", start, end: start + half * 2 });
    if (macdChart) macdChart.dispatchAction({ type: "dataZoom", start, end: start + half * 2 });
  }, { passive: false });
  wrap.addEventListener("touchend", () => { p0 = null; });
})();

        <td class="${inPivot ? "up" : "muted"}">${inPivot ? "在中枢内" : "中枢外"}</td></tr>`);
    } catch (e) {
      rows.push(`<tr><td>${name}</td><td colspan="6" class="muted">无数据（该股没有分钟数据）</td></tr>`);
    }
  }
  openModal(`${code} 多级别结构`, `<table><thead><tr>
    <th>级别</th><th>K线</th><th>笔</th><th>段</th><th>中枢</th><th>信号</th><th>现价位置</th>
  </tr></thead><tbody>${rows.join("")}</tbody></table>
  <div class="muted" style="margin-top:10px;font-size:12px">说明：这是「区间套」的简化版 —— 同一只股票在三个级别上各自的分型/笔/中枢数量，以及现价是否落在某一级别中枢区间内。</div>`);
});

/* ============================================================
 * SVG K 线（画法对齐主站 live.html）
 * 蜡烛 + 成交量 + MA5/10/20/60 + 筹码带/主力带 + 关键位带
 * + 缠论叠加：笔 / 线段 / 中枢 / 买卖点
 * 缩放：滚轮 20~500 根、拖动平移、双击复位；点蜡烛看当天分时
 * ============================================================ */
const KV = { count: 150, end: 0, drag: null, moved: false, hover: -1 };
const kvClamp = (v, a, b) => Math.max(a, Math.min(b, v));
function kvInit() {
  if (!CUR.bars || !CUR.bars.length) return;
  KV.end = CUR.bars.length - 1;
  KV.count = Math.min(150, CUR.bars.length);
}

function kvMA(bars, p) {
  const out = new Array(bars.length).fill(null);
  let sum = 0;
  for (let i = 0; i < bars.length; i++) {
    sum += bars[i].c;
    if (i >= p) sum -= bars[i - p].c;
    if (i >= p - 1) out[i] = sum / p;
  }
  return out;
}

function kvSVG() {
  const bars = CUR.bars;
  if (!bars || !bars.length) return "";
  const res = CUR.res || { sl: [], segs: [], pivots: [], sig: [] };
  const n = bars.length;
  if (!(KV.end > 0) || KV.end > n - 1) { KV.end = n - 1; KV.count = Math.min(150, n); }
  KV.end = kvClamp(KV.end, 1, n - 1);
  KV.count = kvClamp(KV.count, 20, 500);
  const dispEnd = KV.end, dispStart = Math.max(0, dispEnd - KV.count + 1);
  const pad = 3, i0 = Math.max(0, dispStart - pad), i1 = Math.min(n - 1, dispEnd + pad);
  const rows = bars.slice(i0, i1 + 1), m = rows.length;
  const GUT = (CUR.flags.chips || CUR.flags.flow) ? 136 : 0;
  const W = 1000, H = 440, PL = 54, PR = 12 + GUT, PT = 10, PB = 22, volH = 68;
  const ih = H - PT - PB - volH, iw = W - PL - PR, bw = iw / Math.max(1, m);
  let hi = -Infinity, lo = Infinity, maxV = 0;
  rows.forEach((b) => { if (b.h > hi) hi = b.h; if (b.l < lo) lo = b.l; if (b.v > maxV) maxV = b.v; });
  if (!isFinite(hi) || !isFinite(lo)) return "";
  const rg = (hi - lo) || 1; maxV = maxV || 1;
  const X = (i) => PL + i * bw + bw / 2;
  const Y = (v) => PT + (1 - (v - lo) / rg) * ih;
  const VY = (v) => H - PB - (v / maxV) * volH;
  const fmt2 = (v) => (Math.round(v * 100) / 100).toFixed(2);
  window.__KV = { flags: { ...CUR.flags }, sl: (res.sl || []).length, i0, i1, n,
    firstSl: (res.sl && res.sl[0]) ? { i0: res.sl[0].i0, i1: res.sl[0].i1, p0: res.sl[0].p0 } : null };

  // 网格 + 价格刻度
  let grid = "";
  for (let k = 0; k <= 4; k++) {
    const gy = PT + (k / 4) * ih, val = hi - (k / 4) * rg;
    grid += `<line x1="${PL}" y1="${gy.toFixed(1)}" x2="${W - PR}" y2="${gy.toFixed(1)}" stroke="rgba(148,163,184,.14)" stroke-width="1"/>`
      + `<text x="${PL - 6}" y="${(gy + 3).toFixed(1)}" font-size="10" fill="#8b98ad" text-anchor="end">${fmt2(val)}</text>`;
  }
  // 成交量基线
  grid += `<line x1="${PL}" y1="${H - PB}" x2="${W - PR}" y2="${H - PB}" stroke="rgba(148,163,184,.25)" stroke-width="1"/>`;

  // 筹码带 / 主力带（右侧内部，TDX 层序：VA底 → 峰 → POC → K线在下层）
  let chipsSvg = "";
  const flowMap = (typeof FLOW !== "undefined" && FLOW && FLOW.days) || null;
  if (CUR.flags.chips || CUR.flags.flow) {
    const useFlow = !!CUR.flags.flow;
    const cp = chipsFor(bars, dispStart, dispEnd, 44, useFlow ? flowMap : null);
    if (cp && cp.length) {
      const xR = W - 14, maxW = Math.max(56, GUT - 14);
      let peak = 0;
      cp.forEach((o) => { if (o.w > peak) peak = o.w; });
      peak = peak || 1;
      let bb = "";
      let poc = cp[0], pocW = -1;
      cp.forEach((o) => {
        if (!(o.w > 0)) return;
        if (o.w > pocW) { pocW = o.w; poc = o; }
        const w = (o.w / peak) * maxW;
        const yT = Y(o.p1), yB = Y(o.p0);
        const core = o.w >= 0.66;
        const fill = useFlow ? (core ? "#8b5cf6" : "#94a3b8") : (core ? "#3b82f6" : "#94a3b8");
        bb += `<rect x="${(xR - w).toFixed(1)}" y="${yT.toFixed(1)}" width="${w.toFixed(1)}"`
          + ` height="${Math.max(0.9, yB - yT).toFixed(1)}" fill="${fill}" opacity="${core ? 0.65 : 0.26}"/>`;
      });
      const pocP = (poc.p0 + poc.p1) / 2;
      const yP = Y(pocP);
      chipsSvg = `<g>${bb}`
        + `<line x1="${(xR - maxW).toFixed(1)}" y1="${yP.toFixed(1)}" x2="${xR.toFixed(1)}" y2="${yP.toFixed(1)}"`
        + ` stroke="${useFlow ? "#8b5cf6" : "#3b82f6"}" stroke-width="1.2" stroke-dasharray="4,3"/>`
        + `<text x="${(xR - maxW + 2).toFixed(1)}" y="${(yP - 4).toFixed(1)}" font-size="9.5"`
        + ` fill="${useFlow ? "#c4b5fd" : "#93c5fd"}">${useFlow ? "主力POC" : "POC"} ${fmt2(pocP)}</text></g>`;
    }
  }

  // 关键位带
  let levelSvg = "";
  if (CUR.flags.levels) {
    const lv = keyLevels(bars);
    const band = (p, color, tag) => {
      const up = p * 1.015, dn = p * 0.985;
      const yT = Y(Math.min(up, hi)), yB = Y(Math.max(dn, lo));
      const py = Y(p);
      return `<rect x="${PL}" y="${yT.toFixed(1)}" width="${iw.toFixed(1)}" height="${Math.max(1, yB - yT).toFixed(1)}" fill="${color}" opacity="0.1"/>`
        + `<line x1="${PL}" y1="${py.toFixed(1)}" x2="${W - PR}" y2="${py.toFixed(1)}" stroke="${color}" stroke-width="1" stroke-dasharray="5,4" opacity="0.85"/>`
        + `<text x="${W - PR - 6}" y="${(py - 3).toFixed(1)}" font-size="9.5" fill="${color}" text-anchor="end">${tag} ${fmt2(p)}</text>`;
    };
    lv.forEach((l) => { levelSvg += band(l.p, l.k === "up" ? "#ef4444" : "#22c55e", l.t); });
    const hh120 = Math.max.apply(null, bars.slice(-120).map((b) => b.h));
    if (hh120 > 0) {
      const py = Y(hh120);
      levelSvg += `<line x1="${PL}" y1="${py.toFixed(1)}" x2="${W - PR}" y2="${py.toFixed(1)}" stroke="#38bdf8" stroke-width="1.2"/>`
        + `<text x="${W - PR - 6}" y="${(py - 3).toFixed(1)}" font-size="9.5" fill="#7dd3fc" text-anchor="end">突破 ${fmt2(hh120)}</text>`;
    }
  }

  // 蜡烛 + 副图（成交量 / MACD）
  let candles = "", volbars = "";
  rows.forEach((b, i) => {
    const up = b.c >= b.o, col = up ? "#d64545" : "#2fa36b";
    const cx = X(i), cw = Math.max(1, bw * 0.68);
    candles += `<line x1="${cx.toFixed(1)}" y1="${Y(b.h).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${Y(b.l).toFixed(1)}" stroke="${col}" stroke-width="1"/>`;
    const yT = Y(Math.max(b.o, b.c)), yB = Y(Math.min(b.o, b.c));
    candles += `<rect data-d="${b.d}" x="${(cx - cw / 2).toFixed(1)}" y="${yT.toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(1.2, yB - yT).toFixed(1)}" fill="${col}"/>`;
    volbars += `<rect data-d="${b.d}" x="${(cx - cw / 2).toFixed(1)}" y="${VY(b.v).toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(1, H - PB - VY(b.v)).toFixed(1)}" fill="${col}" opacity="0.5"/>`;
  });
  if (CUR.flags.sub === "macd" && res.md) {
    const md = res.md;
    let dmax = 0.0001;
    for (let gi = i0; gi <= i1; gi++) {
      dmax = Math.max(dmax, Math.abs(md.dif[gi] || 0), Math.abs(md.dea[gi] || 0), Math.abs(md.hist[gi] || 0));
    }
    const MY = (v) => PT + ih + volH / 2 - (v / dmax) * (volH / 2 - 2);
    let mbars = "", lines = "";
    for (let gi = i0; gi <= i1; gi++) {
      const hv = md.hist[gi] || 0;
      const i = gi - i0, cx = X(i);
      const y0 = MY(0), y1 = MY(hv);
      mbars += `<rect x="${(cx - Math.max(1, bw * 0.3)).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${Math.max(1, bw * 0.6).toFixed(1)}" height="${Math.max(0.8, Math.abs(y1 - y0)).toFixed(1)}" fill="${hv >= 0 ? "#d64545" : "#2fa36b"}" opacity="0.65"/>`;
    }
    const mk = (arr, color) => {
      let d = "";
      for (let gi = i0; gi <= i1; gi++) {
        d += (d ? "L" : "M") + X(gi - i0).toFixed(1) + " " + MY(arr[gi] || 0).toFixed(1);
      }
      return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.1"/>`;
    };
    lines = mbars + mk(md.dif, "#e0a03b") + mk(md.dea, "#3b82f6")
      + `<line x1="${PL}" y1="${MY(0).toFixed(1)}" x2="${W - PR}" y2="${MY(0).toFixed(1)}" stroke="rgba(148,163,184,.35)" stroke-width="1"/>`;
    volbars = lines;
  }

  // 均线（全序列计算，裁剪到可视区）
  const maDefs = [[5, "#e0a03b"], [10, "#3b82f6"], [20, "#a855f7"], [60, "#8b5cf6"]];
  let maSvg = "";
  maDefs.forEach(([p, col]) => {
    const arr = kvMA(bars, p);
    let d = "";
    for (let gi = i0; gi <= i1; gi++) {
      const v = arr[gi];
      if (v == null) continue;
      const i = gi - i0;
      d += (d ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1);
    }
    if (d) maSvg += `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.1" opacity="0.9"/>`;
  });

  // 缠论：笔 / 线段 / 中枢 / 买卖点
  let chanSvg = "";
  const mi = res.mi || [];
  const rawOf = (gi) => (mi[gi] !== undefined ? mi[gi] : gi);
  const rowOf = (gi) => rawOf(gi) - i0;
  if (CUR.flags.stroke && res.sl) {
    let d = "";
    res.sl.forEach((s) => {
      const a = rowOf(s.i0), b = rowOf(s.i1);
      if (b < 0 || a > m - 1) return;
      d += (d ? "L" : "M") + X(a).toFixed(1) + " " + Y(s.p0).toFixed(1)
        + "L" + X(b).toFixed(1) + " " + Y(s.p1).toFixed(1);
    });
    if (d) chanSvg += `<path d="${d}" fill="none" stroke="#f59e0b" stroke-width="1.3" opacity="0.9"/>`;
  }
  if (CUR.flags.seg && res.segs) {
    res.segs.forEach((s) => {
      if (s.i0 == null || s.i1 == null || s.p0 == null) return;
      const a = rowOf(s.i0), b = rowOf(s.i1);
      if (b < 0 || a > m - 1) return;
      chanSvg += `<line x1="${X(a).toFixed(1)}" y1="${Y(s.p0).toFixed(1)}" x2="${X(b).toFixed(1)}" y2="${Y(s.p1).toFixed(1)}" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="6,4" opacity="0.9"/>`;
    });
  }
  if (CUR.flags.pivot && res.pivots) {
    res.pivots.forEach((p) => {
      const a = rowOf(p.i0), b = rowOf(p.i1);
      if (b < 0 || a > m - 1) return;
      const x1 = X(Math.max(0, a)), x2 = X(Math.min(m - 1, b));
      const yT = Y(p.zg), yB = Y(p.zd);
      chanSvg += `<rect x="${x1.toFixed(1)}" y="${yT.toFixed(1)}" width="${Math.max(2, x2 - x1).toFixed(1)}" height="${Math.max(1, yB - yT).toFixed(1)}" fill="rgba(59,130,246,.10)" stroke="rgba(96,165,250,.45)" stroke-width="1"/>`;
    });
  }
  if (CUR.flags.sig && res.sig) {
    res.sig.forEach((s) => {
      const a = s.i - i0;
      if (a < 0 || a > m - 1) return;
      const buy = s.type.indexOf("买") >= 0;
      const col = buy ? "#f87171" : "#34d399";
      const yy = Y(s.p) + (buy ? 14 : -10);
      chanSvg += `<circle cx="${X(a).toFixed(1)}" cy="${Y(s.p).toFixed(1)}" r="3" fill="${col}"/>`
        + `<text x="${X(a).toFixed(1)}" y="${yy.toFixed(1)}" font-size="9" fill="${col}" text-anchor="middle">${s.type}</text>`;
    });
  }

  // 十字光标
  const cross = `<g id="kvCross" style="display:none">
      <line id="kvV" x1="0" y1="${PT}" x2="0" y2="${H - PB}" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>
      <line id="kvH" x1="${PL}" y1="0" x2="${W - PR}" y2="0" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>
      <rect id="kvBox" x="${PL}" y="${PT}" width="188" height="86" rx="4" fill="#0f172a" stroke="rgba(148,163,184,.35)" opacity="0.96"/>
      <text id="kvText" x="${PL + 8}" y="${PT + 15}" font-size="10.5" fill="#cbd5e1"></text>
    </g>`;

  const legend = `日K（前复权）｜橙MA5 蓝MA10 紫MA20 紫MA60 ｜ 红=压力带 绿=支撑带 蓝=突破线 ｜ 筹码带：蓝=核心(≥66%峰) 灰=边缘，POC=最密档 ｜ ${(rows[dispStart - i0] || {}).d} ~ ${(rows[dispEnd - i0] || {}).d}`;

  return `<svg id="kvSvg" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none"
      style="display:block;width:100%;height:auto;touch-action:none;cursor:crosshair">
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
    ${grid}${levelSvg}${chipsSvg}${volbars}${candles}${maSvg}${chanSvg}${cross}
    <text x="${PL}" y="${H - 5}" font-size="9.5" fill="#8b98ad">${legend}</text>
  </svg>`;
}

function kvPaint() {
  const host = document.querySelector("#klWrap");
  if (!host || !CUR.bars) return;
  host.innerHTML = kvSVG();
  kvBind();
}

function kvBind() {
  const svg = document.querySelector("#kvSvg");
  if (!svg) return;
  const n = CUR.bars.length;
  svg.style.touchAction = "none";
  let raf = 0;
  const schedule = () => {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; kvPaint(); });
  };
  const touchDist = (e) => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  let pinchBase = 0;
  svg.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) pinchBase = touchDist(e);
  }, { passive: true });
  svg.addEventListener("touchmove", (e) => {
    if (e.touches.length !== 2 || !pinchBase) return;
    e.preventDefault();
    const d = touchDist(e);
    const k = d / pinchBase;
    if (Math.abs(k - 1) < 0.03) return;
    KV.count = kvClamp(Math.round(KV.count / k), 20, 500);
    pinchBase = d;
    schedule();
  }, { passive: false });
  svg.addEventListener("touchend", () => { pinchBase = 0; }, { passive: true });
  svg.addEventListener("touchcancel", () => { pinchBase = 0; KV.drag = null; }, { passive: true });
  const kvCrossAt = (clientX, clientY) => {
    const rect = svg.getBoundingClientRect();
    const px = ((clientX - rect.left) / rect.width) * 1000;
    const dispStart = Math.max(0, KV.end - KV.count + 1);
    const i0 = Math.max(0, dispStart - 3);
    const bw = (1000 - 66) / Math.min(CUR.bars.length || 1, KV.count + 6);
    const idx = Math.round((px - 54 - bw / 2) / bw);
    const gi = i0 + idx;
    if (gi < 0 || gi >= (CUR.bars.length || 0)) return;
    const b = CUR.bars[gi];
    const g = svg.querySelector("#kvCross");
    const v = svg.querySelector("#kvV"), h = svg.querySelector("#kvH");
    const t = svg.querySelector("#kvText");
    if (!g || !v || !h || !t) return;
    g.style.display = "";
    v.setAttribute("x1", px.toFixed(1)); v.setAttribute("x2", px.toFixed(1));
    const yv = clientY - rect.top;
    h.setAttribute("y1", yv.toFixed(1)); h.setAttribute("y2", yv.toFixed(1));
    const prev = gi > 0 ? CUR.bars[gi - 1].c : b.o;
    const pct = ((b.c - prev) / prev) * 100;
    t.innerHTML = `<tspan x="62" dy="0">${b.d}</tspan>`
      + `<tspan x="62" dy="13">开 ${b.o.toFixed(2)}  高 ${b.h.toFixed(2)}</tspan>`
      + `<tspan x="62" dy="13">低 ${b.l.toFixed(2)}  收 ${b.c.toFixed(2)}</tspan>`
      + `<tspan x="62" dy="13">涨跌 ${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%</tspan>`
      + `<tspan x="62" dy="13">量 ${(b.v / 10000).toFixed(1)} 万手</tspan>`;
  };

  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    KV.count = kvClamp(Math.round(KV.count * (e.deltaY > 0 ? 1.2 : 0.8)), 20, 500);
    schedule();
  }, { passive: false });

  svg.addEventListener("pointerdown", (e) => { KV.drag = e.clientX; KV.moved = false; });
  window.addEventListener("pointerup", () => { KV.drag = null; });
  svg.addEventListener("pointermove", (e) => {
    if (KV.drag != null) {
      const dx = e.clientX - KV.drag;
      if (Math.abs(dx) > 6) {
        const iw = 1000 - 66, bw = iw / KV.count;
        const shift = Math.round(dx / (bw * (svg.clientWidth / 1000)));
        if (shift) {
          KV.end = kvClamp(KV.end - shift, 0, n - 1);
          KV.drag = e.clientX; KV.moved = true;
          schedule();
        }
      }
      return;
    }
    kvCrossAt(e.clientX, e.clientY);
  });
  svg.addEventListener("pointercancel", () => { KV.drag = null; });
  svg.addEventListener("pointerleave", () => {
    const g = svg.querySelector("#kvCross");
    if (g) g.style.display = "none";
  });
  svg.addEventListener("dblclick", () => {
    KV.count = Math.min(250, n); KV.end = n - 1; schedule();
  });
  svg.addEventListener("click", (e) => {
    if (KV.moved) { KV.moved = false; return; }
    kvCrossAt(e.clientX, e.clientY);
    const d = e.target.getAttribute && e.target.getAttribute("data-d");
    if (d && typeof showMinute === "function") showMinute(d);
  });
}

// SVG 版绘制入口（替代 echarts 版）
function drawSVG(bars, res) {
  if (bars) CUR.bars = bars;
  if (res) CUR.res = res;
  if (!KV.count || KV.end >= (CUR.bars || []).length) kvInit();
  kvPaint();
}

// 覆盖旧的 canvas 筹码层：统一走 SVG
function drawChipOverlaySVG() { kvPaint(); }
