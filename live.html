<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>实盘监测 · 活跃市值</title>
<style>
:root { --bg:#f5f6f8; --card:#fff; --text:#1a1d24; --muted:#6b7280;
        --red:#d64545; --green:#2fa36b; --blue:#3b6fe0; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
header { padding:14px 24px; background:var(--card); border-bottom:1px solid #e5e7eb;
         display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
header h1 { font-size:18px; }
header .back { font-size:13px; color:var(--blue); text-decoration:none; }
header .time { font-size:12px; color:var(--muted); margin-left:auto; }
.wrap { max-width:1200px; margin:0 auto; padding:14px; }
.indices { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
.idx { background:var(--card); border-radius:10px; padding:12px 16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.idx .n { font-size:13px; color:var(--muted); }
.idx .p { font-size:22px; font-weight:700; margin:4px 0; }
.idx .c { font-size:14px; font-weight:600; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:900px){ .grid{grid-template-columns:1fr;} .indices{grid-template-columns:1fr 1fr;} }
.card { background:var(--card); border-radius:10px; padding:12px 14px; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:14px; }
.card h2 { font-size:14px; margin-bottom:8px; }
.tabs { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
.tab { padding:2px 12px; border:1px solid #d1d5db; border-radius:5px; background:#fff;
       cursor:pointer; font-size:12px; color:#374151; }
.tab.active { background:var(--blue); color:#fff; border-color:var(--blue); }
table { width:100%; border-collapse:collapse; font-size:12.5px; }
th,td { padding:4px 8px; text-align:right; border-bottom:1px solid #eef0f3; }
th:first-child,td:first-child { text-align:left; }
th { color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--card); }
.up { color:var(--red); } .down { color:var(--green); }
.scroll { max-height:560px; overflow-y:auto; }
.search { padding:4px 10px; border:1px solid #d1d5db; border-radius:5px; width:180px; font-size:13px; }
.flat { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>实盘监测</h1>
  <a class="back" href="index.html">← 返回研究主页</a>
  <button id="btnNow" onclick="refreshNow()" style="padding:3px 14px;border:1px solid #d1d5db;border-radius:5px;background:#fff;cursor:pointer;font-size:13px;">🔄 立即刷新</button>
  <span class="time" id="updTime">加载中…</span>
</header>
<div class="wrap">
  <div class="indices" id="idxBox"></div>
  <div class="card">
    <h2>指数分时（当日）</h2>
    <div style="display:flex;flex-wrap:wrap;gap:12px;" id="minBox"></div>
  </div>
  <div class="card">
    <h2>市场情绪</h2>
    <div id="breadth" style="font-size:13px;"></div>
  </div>
  <div class="card">
    <h2>🌡️ 市场温度计 <span style="font-size:12px;color:var(--muted);font-weight:normal;">每日涨跌家数（近 250 日，红=上涨家数，绿=下跌家数）</span></h2>
    <div id="tempBox"></div>
  </div>
  <div class="card">
    <h2>💰 资金主线雷达 <span style="font-size:12px;color:var(--muted);font-weight:normal;">主力净流入板块（东财口径）→ 推理主线</span></h2>
    <div id="flowBox" style="font-size:13px;"></div>
  </div>
  <div class="card">
    <h2>个股信号（逐股递推·日频）
      <span style="font-size:12px;color:var(--muted);font-weight:normal;">查个股：
        <input id="sigSearch" placeholder="代码或名称" style="padding:3px 8px;border:1px solid #d1d5db;border-radius:5px;width:150px;font-size:12.5px;">
        <button onclick="showSignal()" style="padding:2px 10px;border:1px solid #d1d5db;border-radius:5px;background:#fff;cursor:pointer;font-size:12.5px;">查看</button>
        <span id="sigResult" style="margin-left:8px;font-size:13px;"></span>
      </span>
    </h2>
    <div style="margin:4px 0;font-size:12px;">⭐ 自选：
      <input id="favInput" placeholder="代码如 600825" style="padding:3px 8px;border:1px solid #d1d5db;border-radius:5px;width:130px;font-size:12.5px;">
      <button onclick="addFav()" style="padding:2px 10px;border:1px solid #d1d5db;border-radius:5px;background:#fff;cursor:pointer;font-size:12.5px;">添加</button>
      <button onclick="delFav()" style="padding:2px 10px;border:1px solid #d1d5db;border-radius:5px;background:#fff;cursor:pointer;font-size:12.5px;">清空</button>
      <span id="favList"></span>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="setSigTab('up')">🔼 拐头向上</button>
      <button class="tab" onclick="setSigTab('down')">🔽 拐头向下</button>
      <button class="tab" onclick="setSigTab('hot')">🔥 高位偏离</button>
    </div>
    <div class="scroll" id="sigList" style="max-height:420px;"></div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>🎯 龙头 · 补涨识别 <span style="font-size:12px;color:var(--muted);font-weight:normal;">每板块最强股（连板最高）→ 点击看同板块补涨候选</span></h2>
      <div id="leaderBox" style="font-size:13px;"></div>
    </div>
    <div class="card">
      <h2>🔄 高切低监测 <span style="font-size:12px;color:var(--muted);font-weight:normal;">炸板退潮 vs 低位首板接力</span></h2>
      <div id="switchBox" style="font-size:13px;"></div>
    </div>
    <div class="card">
      <h2>📋 龙虎榜（最新一期）<span id="lhbDate" style="font-size:12px;color:var(--muted);"></span></h2>
      <div class="scroll" id="lhbList" style="max-height:420px;"></div>
    </div>
    <div class="card">
      <h2>涨停池（今日）<span id="limitCnt" style="font-size:12px;color:var(--muted);"></span> <span id="promoBox" style="font-size:12px;color:var(--muted);"></span></h2>
      <div id="ladderBox" style="margin-bottom:8px;"></div>
      <div class="scroll" id="limitList" style="max-height:420px;"></div>
    </div>
    <div class="card">
      <h2>板块实时（通达信口径）<span id="blkDetail" style="font-size:12px;color:var(--muted);float:right;"></span></h2>
      <div class="tabs">
        <button class="tab active" onclick="setBlkTab('concept')">概念</button>
        <button class="tab" onclick="setBlkTab('style')">风格</button>
        <button class="tab" onclick="setBlkTab('up')">领涨</button>
        <button class="tab" onclick="setBlkTab('down')">领跌</button>
        <input class="search" id="blkSearch" placeholder="搜索板块…" oninput="renderBlocks()">
      </div>
      <div class="scroll" id="blkList"></div>
    </div>
    <div class="card">
      <h2>个股实时 <button class="tab" onclick="backToStkList()" style="float:right;">返回全市场</button></h2>
      <div class="tabs">
        <button class="tab active" onclick="setStkTab('up')">涨幅榜</button>
        <button class="tab" onclick="setStkTab('down')">跌幅榜</button>
        <button class="tab" onclick="setStkTab('amount')">成交额榜</button>
        <button class="tab" onclick="setStkTab('turnover')">换手榜</button>
        <input class="search" id="stkSearch" placeholder="代码/名称…" oninput="renderStocks()">
      </div>
      <div class="scroll" id="stkList"></div>
    </div>
  </div>
</div>
<script>
let LD = null;
let BLK_TAB = "concept";
let STK_TAB = "up";
let MEMBERS = {}; // 板块成分（从 concept_blocks.json 加载）

function loadMembers() {
  fetch("concept_blocks.json?v=" + new Date().getTime())
    .then(r => r.json())
    .then(j => {
      j.forEach(b => { MEMBERS[b.name] = b.stocks; });
      renderLeader();  // 成分加载完成后刷新龙头·补涨
    })
    .catch(() => {});
}

function refreshNow() {
  const btn = document.getElementById("btnNow");
  if (!btn) return;
  btn.textContent = "⏳ 刷新中…";
  btn.disabled = true;
  fetchGz("https://amv-live-1500351250.cos.ap-guangzhou.myqcloud.com/live_data.json.gz")
    .then(j => {
      // 信号保留更好的那份（与 renderAll 一致）
      const curCnt = (LD && LD.signals) ? Object.keys(LD.signals).length : 0;
      const newCnt = (j.signals) ? Object.keys(j.signals).length : 0;
      if (curCnt > newCnt) {
        j.signals = LD.signals;
      }
      LD = j;
      const up = (j.updated_at || "").replace(" ", "T");
      const lag = up ? Math.max(0, Math.round((Date.now() - new Date(up).getTime()) / 60000)) : -1;
      let t = "更新 " + (j.updated_at || "");
      if (lag >= 0) {
        t = lag <= 4 ? t + "（最新）" : `<span style="color:#c0392b;font-weight:bold;">更新 ${j.updated_at}（已滞后 ${lag} 分钟）</span>`;
      }
      document.getElementById("updTime").innerHTML = t;
      renderIndices();
      renderBreadth();
      renderSignals();
      renderMinutes();
      renderLimits();
      renderBlocks();
      renderStocks();
      btn.textContent = "✅ 已刷新";
      setTimeout(() => { btn.textContent = "🔄 立即刷新"; btn.disabled = false; }, 1500);
    })
    .catch(() => {
      btn.textContent = "❌ 失败，重试";
      btn.disabled = false;
      document.getElementById("updTime").innerHTML =
        '<span style="color:#c0392b;">数据拉取失败，请稍后再试</span>';
    });
}

async function fetchGz(url) {
  // 优先拉 gzip 压缩版（体积小 85%，手机快）；浏览器不支持则回退原文件
  if (typeof DecompressionStream !== "undefined") {
    try {
      const r = await fetch(url);
      if (r.ok) {
        const buf = await r.arrayBuffer();
        const ds = new DecompressionStream("gzip");
        const stream = new Blob([buf]).stream().pipeThrough(ds);
        return await new Response(stream).json();
      }
    } catch (e) {}
  }
  const r2 = await fetch(url.replace(".json.gz", ".json") + "?t=" + new Date().getTime());
  return r2.json();
}

function loadData() {
  // 主数据源：腾讯云 COS（每分钟更新）；失败回退 Pages
  fetchGz("https://amv-live-1500351250.cos.ap-guangzhou.myqcloud.com/live_data.json.gz")
    .then(j => renderAll(j))
    .catch(() => {
      fetch("live_data.json?v=" + new Date().getTime())
        .then(r => r.json())
        .then(j => renderAll(j))
        .catch(() => {
          document.getElementById("updTime").innerHTML =
            '<span style="color:#c0392b;">数据拉取失败，稍后自动重试</span>';
        });
    });
}

function renderAll(j) {
  // 数据没变（updated_at 相同）就跳过重绘，消除自动刷新闪烁
  if (LD && LD.updated_at === j.updated_at) {
    return;
  }
  // 信号数据保留更好的那份（避免自动刷新被云函数旧信号短暂覆盖）
  const curCnt = (LD && LD.signals) ? Object.keys(LD.signals).length : 0;
  const newCnt = (j.signals) ? Object.keys(j.signals).length : 0;
  if (curCnt > newCnt) {
    j.signals = LD.signals;
  }
  LD = j;
  const up = (j.updated_at || "").replace(" ", "T");
  const lag = up ? Math.max(0, Math.round((Date.now() - new Date(up).getTime()) / 60000)) : -1;
  let t = "更新 " + (j.updated_at || "");
  if (lag >= 0) {
    if (lag <= 4) t += "（最新）";
    else if (lag <= 240) t = `<span style="color:#c0392b;font-weight:bold;">更新 ${j.updated_at}（已滞后 ${lag} 分钟）</span>`;
    else t += "（盘后/休市数据，盘中自动更新）";
  }
  document.getElementById("updTime").innerHTML = t;
  renderIndices();
  renderBreadth();
  renderTemp();
  renderFlow();
  renderSignals();
  renderLHB();
  renderLeader();
  renderSwitch();
  renderMinutes();
  renderLimits();
  renderBlocks();
  renderStocks();
}

function loadSignalsFromPages() {
  // 信号优先读腾讯云缓存（与主数据同源，快）；失败回退 Pages 压缩版
  fetch("https://amv-live-1500351250.cos.ap-guangzhou.myqcloud.com/signals_cache.json?t=" + new Date().getTime())
    .then(r => r.json())
    .then(j => {
      const sigs = (j && j.signals) || {};
      const cur = (LD && LD.signals) ? Object.keys(LD.signals).length : 0;
      if (Object.keys(sigs).length > cur) {
        LD.signals = sigs;
        renderSignals();
        renderLimits();
      }
    })
    .catch(() => {
      fetchGz("signals2.json.gz")
        .then(j => {
          const sigs = (j && j.signals) || {};
          const cur = (LD && LD.signals) ? Object.keys(LD.signals).length : 0;
          if (Object.keys(sigs).length > cur) {
            LD.signals = sigs;
            renderSignals();
            renderLimits();
          }
        })
        .catch(() => {});
    });
}

let SIG_TAB = "up";

function setSigTab(t) {
  SIG_TAB = t;
  document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
  renderSignals();
}

function renderTemp() {
  const el = document.getElementById("tempBox");
  if (!el) return;
  el.innerHTML = "<span style='color:var(--muted);'>加载中…</span>";
  fetch("breadth_history.json?v=" + new Date().getTime())
    .then(r => r.json())
    .then(j => {
      const h = j.history || [];
      if (!h.length) {
        el.innerHTML = "<span style='color:var(--muted);'>暂无数据。</span>";
        return;
      }
      const W = 660, H = 170, P = 8;
      const bw = (W - P * 2) / h.length;
      const base = H / 2;
      const half = H / 2 - 12;
      let bars = "";
      let maxV = 1;
      h.forEach(x => { maxV = Math.max(maxV, x.up, x.down); });
      h.forEach((x, i) => {
        const cx = P + i * bw + bw / 2;
        const uh = (x.up / maxV) * half;
        const dh = (x.down / maxV) * half;
        bars += `<rect x="${(cx - bw * 0.35).toFixed(1)}" y="${(base - uh).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${uh.toFixed(1)}" fill="#d64545" opacity="0.8"/>`;
        bars += `<rect x="${(cx - bw * 0.35).toFixed(1)}" y="${base.toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${dh.toFixed(1)}" fill="#2fa36b" opacity="0.8"/>`;
      });
      const first = h[0], last = h[h.length - 1];
      el.innerHTML = `<svg width="100%" viewBox="0 0 ${W} ${H}" style="background:#fcfcfd;border:1px solid #e5e7eb;border-radius:6px;">
        <line x1="${P}" y1="${base}" x2="${W - P}" y2="${base}" stroke="#d8dbe0" stroke-width="1"/>
        ${bars}
        <text x="${P}" y="10" font-size="9" fill="#8a8f98">上：上涨家数（红）</text>
        <text x="${P}" y="${H - 4}" font-size="9" fill="#8a8f98">下：下跌家数（绿）｜ ${first.date} ~ ${last.date}</text>
      </svg>`;
    })
    .catch(() => { el.innerHTML = "<span style='color:var(--muted);'>加载失败。</span>"; });
}

function renderFlow() {
  const el = document.getElementById("flowBox");
  if (!el || !LD || !LD.board_flow || !LD.board_flow.length) {
    if (el) el.innerHTML = "<span style='color:var(--muted);'>盘前/休市暂无资金流数据，开盘后（9:15 起）自动更新。</span>";
    return;
  }
  const arr = LD.board_flow.slice(0, 12);
  const solid = arr.filter(x => (x.flow || 0) > 1 && (x.flow5 || 0) > 0 && (x.flow10 || 0) > 0 && (x.pct || 0) > 0).slice(0, 3);
  const pulse = arr.filter(x => (x.flow || 0) > 3 && (x.flow5 || 0) <= 0).slice(0, 3);
  let html = "";
  if (solid.length) {
    html += `<div style="padding:4px 0 6px;">🎯 主线（多日持续流入+上涨）：${solid.map(x => `<b style="color:#c0392b;">${x.name}</b>`).join("、")}</div>`;
  } else {
    html += "<div style='padding:4px 0 6px;color:var(--muted);'>暂无多日持续流入的主线板块。</div>";
  }
  if (pulse.length) {
    html += `<div style="padding:0 0 6px;font-size:12px;">⚡ 单日脉冲（今日流入但5日未持续）：${pulse.map(x => `<span>${x.name}</span>`).join("、")} <span style="color:var(--muted);">（待观察，防止一日游）</span></div>`;
  }
  html += `<table><thead><tr><th>板块</th><th>今日流入(亿)</th><th>5日(亿)</th><th>10日(亿)</th><th>涨跌</th></tr></thead><tbody>`;
  arr.forEach(x => {
    const f = x.flow || 0, f5 = x.flow5 || 0, f10 = x.flow10 || 0;
    const p = x.pct != null ? x.pct : 0;
    html += `<tr><td>${x.name}</td>
      <td class="${f >= 0 ? "up" : "down"}">${f >= 0 ? "+" : ""}${f.toFixed(2)}</td>
      <td class="${f5 >= 0 ? "up" : "down"}">${f5 >= 0 ? "+" : ""}${f5.toFixed(2)}</td>
      <td class="${f10 >= 0 ? "up" : "down"}">${f10 >= 0 ? "+" : ""}${f10.toFixed(2)}</td>
      <td class="${p >= 0 ? "up" : "down"}">${p >= 0 ? "+" : ""}${p}%</td></tr>`;
  });
  html += "</tbody></table>";
  html += `<div style="margin-top:8px;"><button onclick="toggleFlowHistory()" style="padding:2px 10px;border:1px solid #d1d5db;border-radius:5px;background:#fff;cursor:pointer;font-size:12px;">📅 近 10 日主线回看</button><div id="flowHistBox" style="margin-top:4px;"></div></div>`;
  el.innerHTML = html;
}

function toggleFlowHistory() {
  const box = document.getElementById("flowHistBox");
  if (!box) return;
  if (box.innerHTML) {
    box.innerHTML = "";
    return;
  }
  box.innerHTML = "<span style='color:var(--muted);'>加载中…</span>";
  fetch("https://amv-live-1500351250.cos.ap-guangzhou.myqcloud.com/flow_history/index.json?t=" + new Date().getTime())
    .then(r => r.json())
    .then(j => {
      const days = Object.keys(j.days || {}).sort().slice(-10).reverse();
      if (!days.length) {
        box.innerHTML = "<span style='color:var(--muted);'>暂无历史（从今天收盘开始存档）。</span>";
        return;
      }
      let html = "";
      days.forEach(d => {
        const info = (j.days || {})[d] || {};
        const mains = (info.main || []).map(x => `<b style="color:#c0392b;">${x.name}</b>`).join("、") || "无";
        html += `<div style="padding:3px 0;border-bottom:1px dashed #eee;font-size:12.5px;"><b>${d}</b> 主线：${mains}</div>`;
      });
      box.innerHTML = html;
    })
    .catch(() => { box.innerHTML = "<span style='color:var(--muted);'>加载失败。</span>"; });
}

function renderSignals() {
  const el = document.getElementById("sigList");
  if (!el) return;
  const sigs = LD && LD.signals ? LD.signals : {};
  let all = Object.entries(sigs).map(([code, s]) => ({ code: code, ...s }));
  if (!all.length) {
    el.innerHTML = "<p style='color:var(--muted);'>信号数据加载中…</p>";
    return;
  }
  let arr;
  if (SIG_TAB === "up") arr = all.filter(s => s.cross === "up").sort((a, b) => (b.gap || 0) - (a.gap || 0));
  else if (SIG_TAB === "down") arr = all.filter(s => s.cross === "down").sort((a, b) => (a.gap || 0) - (b.gap || 0));
  else arr = all.filter(s => (s.gap || 0) > 5).sort((a, b) => (b.gap || 0) - (a.gap || 0));
  let html = `<table><thead><tr><th>代码</th><th>名称</th><th>行业</th><th>MA10偏离</th><th>250日分位</th><th>5日趋势</th><th>量能比</th></tr></thead><tbody>`;
  arr.slice(0, 100).forEach(s => {
    const g = s.gap || 0;
    const t5 = s.trend5 != null ? s.trend5 : 0;
    html += `<tr style="cursor:pointer;" onclick="showSignal('${s.code}')"><td>${s.code}</td><td>${s.name}</td><td>${s.industry || "—"}</td>
      <td class="${g >= 0 ? "up" : "down"}">${g >= 0 ? "+" : ""}${g}%</td>
      <td>${s.pctile != null ? s.pctile + "%" : "—"}</td>
      <td class="${t5 >= 0 ? "up" : "down"}">${t5 >= 0 ? "+" : ""}${t5}%</td>
      <td>${s.vol_ratio != null ? s.vol_ratio : "—"}</td></tr>`;
  });
  html += "</tbody></table>";
  el.innerHTML = html;
  renderFavs();
}

let SIG_HIST = null;

function loadSigHistory() {
  if (SIG_HIST) return;
  fetchGz("https://pulsiferkelley87-a11y.github.io/amv-site/sig_history.json.gz")
    .then(j => {
      if (j && j.history) SIG_HIST = j.history;
    })
    .catch(() => {});
}

function trendSVG(vals, color) {
  if (!vals || vals.length < 3) return "";
  const W = 620, H = 200, PL = 62, PR = 10, PT = 14, PB = 26;
  const iw = W - PL - PR, ih = H - PT - PB;
  const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  const rg = (mx - mn) || 1;
  const x = i => PL + (i / (vals.length - 1)) * iw;
  const y = v => PT + (1 - (v - mn) / rg) * ih;
  let d = "", dma = "";
  vals.forEach((v, i) => {
    d += (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1);
    if (i >= 9) {
      const m = vals.slice(i - 9, i + 1).reduce((a, b) => a + b, 0) / 10;
      dma += (i === 9 ? "M" : "L") + x(i).toFixed(1) + " " + y(m).toFixed(1);
    }
  });
  // 横向网格 + 刻度（4 行）
  let grid = "";
  for (let k = 0; k <= 4; k++) {
    const gy = PT + (k / 4) * ih;
    const val = mx - (k / 4) * rg;
    grid += `<line x1="${PL}" y1="${gy.toFixed(1)}" x2="${W - PR}" y2="${gy.toFixed(1)}" stroke="#e8eaee" stroke-width="1"/>`;
    grid += `<text x="${PL - 5}" y="${(gy + 3).toFixed(1)}" font-size="10" fill="#8a8f98" text-anchor="end">${(val / 1e8).toFixed(1)}亿</text>`;
  }
  const last = vals[vals.length - 1];
  const ly = y(last);
  const up = vals[vals.length - 1] >= vals[0];
  const mainColor = up ? "#d64545" : "#2fa36b";
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="background:#fcfcfd;border:1px solid #e5e7eb;border-radius:6px;margin-top:6px;">
    ${grid}
    <path d="${dma}" fill="none" stroke="#e0a03b" stroke-width="1.2" opacity="0.85"/>
    <path d="${d}" fill="none" stroke="${mainColor}" stroke-width="1.8"/>
    <circle cx="${x(vals.length - 1)}" cy="${ly.toFixed(1)}" r="3.5" fill="${mainColor}"/>
    <text x="${x(vals.length - 1) - 5}" y="${(ly - 6).toFixed(1)}" font-size="11" fill="${mainColor}" text-anchor="end">${(last / 1e8).toFixed(1)}亿</text>
    <text x="${PL}" y="${H - 6}" font-size="10" fill="#8a8f98">近60日活跃SZ（蓝=活跃SZ，橙=MA10，单位：亿元）</text>
  </svg>`;
}

function klineSVG(rows) {
  if (!rows || rows.length < 5) return "";
  const W = 660, H = 220, PL = 46, PR = 8, PT = 8, PB = 20;
  const volH = 40;
  const ih = H - PT - PB - volH;
  const iw = W - PL - PR;
  const n = rows.length;
  const bw = iw / n;
  const closes = rows.map(r => parseFloat(r[2]));
  const highs = rows.map(r => parseFloat(r[4]));
  const lows = rows.map(r => parseFloat(r[3]));
  const vols = rows.map(r => parseFloat(r[5]));
  const all = highs.concat(lows).filter(v => v > 0);
  const mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
  const rg = (mx - mn) || 1;
  const maxV = Math.max.apply(null, vols) || 1;
  const x = i => PL + i * bw + bw / 2;
  const y = v => PT + (1 - (v - mn) / rg) * ih;
  const vy = v => H - PB - (v / maxV) * volH;
  let candles = "", volbars = "";
  rows.forEach((r, i) => {
    const o = parseFloat(r[1]), c = parseFloat(r[2]), h = parseFloat(r[4]), l = parseFloat(r[3]);
    if (o <= 0 || c <= 0) return;
    const up = c >= o;
    const col = up ? "#d64545" : "#2fa36b";
    const cx = x(i);
    candles += `<line x1="${cx}" y1="${y(h).toFixed(1)}" x2="${cx}" y2="${y(l).toFixed(1)}" stroke="${col}" stroke-width="1"/>`;
    const top = y(Math.max(o, c)), bot = y(Math.min(o, c));
    const bodyH = Math.max(1.2, bot - top);
    candles += `<rect x="${(cx - bw * 0.35).toFixed(1)}" y="${top.toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${bodyH.toFixed(1)}" fill="${col}"/>`;
    volbars += `<rect x="${(cx - bw * 0.35).toFixed(1)}" y="${vy(vols[i]).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${(H - PB - vy(vols[i])).toFixed(1)}" fill="${col}" opacity="0.55"/>`;
  });
  const maLine = (period, color) => {
    let d = "";
    for (let i = period - 1; i < n; i++) {
      const seg = closes.slice(i - period + 1, i + 1);
      const m = seg.reduce((a, b) => a + b, 0) / period;
      d += (i === period - 1 ? "M" : "L") + x(i).toFixed(1) + " " + y(m).toFixed(1);
    }
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.1"/>`;
  };
  let grid = "";
  for (let k = 0; k <= 4; k++) {
    const gy = PT + (k / 4) * ih;
    const val = mx - (k / 4) * rg;
    grid += `<line x1="${PL}" y1="${gy.toFixed(1)}" x2="${W - PR}" y2="${gy.toFixed(1)}" stroke="#eef0f3" stroke-width="1"/>`;
    grid += `<text x="${PL - 4}" y="${(gy + 3).toFixed(1)}" font-size="9" fill="#8a8f98" text-anchor="end">${val.toFixed(2)}</text>`;
  }
  const last = closes[n - 1];
  const up = last >= closes[0];
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="background:#fcfcfd;border:1px solid #e5e7eb;border-radius:6px;margin-top:6px;">
    ${grid}
    ${volbars}
    ${candles}
    ${maLine(5, "#e0a03b")}
    ${maLine(10, "#3b6fe0")}
    ${maLine(20, "#7c5cbf")}
    <text x="${PL}" y="${H - 5}" font-size="9" fill="#8a8f98">日K（前复权）｜橙MA5 蓝MA10 紫MA20 ｜ ${rows[0][0]} ~ ${rows[n - 1][0]} ｜ 成交量</text>
  </svg>`;
}

let KLINE_RANGE = 250;
let KLINE_PERIOD = "day";
let LAST_KLINE_CODE = "";

function setKlineRange(n) {
  KLINE_RANGE = n;
  if (LAST_KLINE_CODE) loadKline(LAST_KLINE_CODE);
}

function setKlinePeriod(p) {
  KLINE_PERIOD = p;
  if (LAST_KLINE_CODE) loadKline(LAST_KLINE_CODE);
}

function loadKline(code) {
  const box = document.getElementById("klineBox");
  if (!box) return;
  LAST_KLINE_CODE = code;
  const raw = code.startsWith("sh") || code.startsWith("sz") || code.startsWith("bj") ? code
    : (code.startsWith("92") || code.startsWith("4") || code.startsWith("8") ? "bj" + code
       : code.startsWith("6") ? "sh" + code
       : "sz" + code);
  const perBtns = [["day", "日K"], ["week", "周K"], ["month", "月K"]].map(([p, t]) =>
    `<button onclick="setKlinePeriod('${p}')" style="padding:6px 14px;border:1px solid ${p === KLINE_PERIOD ? '#3b6fe0' : '#d1d5db'};border-radius:5px;background:${p === KLINE_PERIOD ? '#3b6fe0' : '#fff'};color:${p === KLINE_PERIOD ? '#fff' : '#374151'};cursor:pointer;font-size:13px;margin-right:5px;">${t}</button>`).join("");
  const rangeBtns = [60, 120, 250, 500, 1000].map(n =>
    `<button onclick="setKlineRange(${n})" style="padding:6px 12px;border:1px solid ${n === KLINE_RANGE ? '#3b6fe0' : '#d1d5db'};border-radius:5px;background:${n === KLINE_RANGE ? '#3b6fe0' : '#fff'};color:${n === KLINE_RANGE ? '#fff' : '#374151'};cursor:pointer;font-size:13px;margin-right:5px;">${n}${KLINE_PERIOD === "day" ? "日" : KLINE_PERIOD === "week" ? "周" : "月"}</button>`).join("");
  fetch(`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${raw},${KLINE_PERIOD},,,${KLINE_RANGE},qfq`)
    .then(r => r.json())
    .then(j => {
      const node = (j.data || {})[raw] || {};
      const rows = node.qfqday || node.qfqweek || node.qfqmonth || node.day || node.week || node.month || [];
      box.innerHTML = rows.length
        ? `<div style="margin-bottom:4px;">${perBtns}${rangeBtns} <span style="font-size:11px;color:var(--muted);">（鼠标滚轮可缩放）</span></div>` + klineSVG(rows)
        : "<span style='font-size:12px;color:var(--muted);'>K线数据暂不可用。</span>";
      const svg = box.querySelector("svg");
      if (svg) {
        let wTimer = null;
        svg.addEventListener("wheel", e => {
          e.preventDefault();
          if (wTimer) return;
          wTimer = setTimeout(() => { wTimer = null; }, 350);
          const steps = [60, 120, 250, 500, 1000];
          const idx = steps.indexOf(KLINE_RANGE);
          const ni = Math.max(0, Math.min(steps.length - 1, idx + (e.deltaY > 0 ? 1 : -1)));
          if (steps[ni] !== KLINE_RANGE) setKlineRange(steps[ni]);
        }, { passive: false });
        // 手机双指缩放
        let pinchStart = null;
        svg.addEventListener("touchstart", e => {
          if (e.touches.length === 2) {
            pinchStart = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                                   e.touches[0].clientY - e.touches[1].clientY);
          }
        }, { passive: true });
        svg.addEventListener("touchmove", e => {
          if (e.touches.length === 2 && pinchStart) {
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                                    e.touches[0].clientY - e.touches[1].clientY);
            const ratio = dist / pinchStart;
            const steps = [60, 120, 250, 500, 1000];
            const idx = steps.indexOf(KLINE_RANGE);
            if (ratio > 1.3 && idx > 0) {
              setKlineRange(steps[idx - 1]);  // 张开 = 放大（更少天数）
              pinchStart = dist;
            } else if (ratio < 0.75 && idx < steps.length - 1) {
              setKlineRange(steps[idx + 1]);  // 捏合 = 缩小（更多天数）
              pinchStart = dist;
            }
          }
        }, { passive: true });
      }
    })
    .catch(() => { box.innerHTML = "<span style='font-size:12px;color:var(--muted);'>K线加载失败。</span>"; });
}

function minuteSVG(pts, color) {
  if (!pts || pts.length < 2) return "";
  const W = 240, H = 110, P = 4;
  const px = pts.map(p => p[1]);
  const mn = Math.min.apply(null, px), mx = Math.max.apply(null, px);
  const rg = (mx - mn) || 1;
  const step = (W - P * 2) / (pts.length - 1);
  let d = "";
  pts.forEach((p, i) => {
    const x = P + i * step;
    const y = P + (1 - (p[1] - mn) / rg) * (H - P * 2);
    d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
  });
  const last = pts[pts.length - 1], first = pts[0];
  return `<svg width="${W}" height="${H + 16}" style="background:#fafbfc;border:1px solid #e5e7eb;border-radius:8px;">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.4"/>
    <text x="4" y="10" font-size="9" fill="#6b7280">${first[0]}</text>
    <text x="${W - 30}" y="10" font-size="9" fill="#6b7280">${last[0]}</text>
    <text x="4" y="${H + 14}" font-size="9" fill="#6b7280">${first[1]}</text>
    <text x="${W - 60}" y="${H + 14}" font-size="9" fill="#6b7280">${last[1]}</text>
  </svg>`;
}

function renderLeader() {

        best = Object.assign({ code: c }, sig);

    });
    if (best && (best.limit_days || 0) >= 1) {

                     ld: best.limit_days || 0, pct: best.gap || 0 });

  });
  leaders.sort((a, b) => b.ld - a.ld);
  // 去重：同一股票属多个板块时，只保留连板最高的那条
  const seenCodes = {};
  leaders = leaders.filter(l => {
    if (seenCodes[l.code]) return false;

    return true;

    return;

    html += "<div style='padding:4px 0;'><b style='color:#c0392b;'>🔥 持续连板（2板+，当前主线高度）</b></div>";

  }
  if (fresh.length) {
    html += "<div style='padding:6px 0 4px;'><b style='color:#b9770e;'>🆕 新起连板（今日首板，最近的新面孔）</b></div>";
    html += buildLeaderTable(fresh.slice(0, 20));
  }
  el.innerHTML = html;
}

function buildLeaderTable(list) {
  const sigs = LD.signals;
  let html = `<table><thead><tr><th>板块</th><th>龙头</th><th>连板</th><th>MA10偏离</th><th>补涨候选</th></tr></thead><tbody>`;
  list.forEach(l => {
    const candidates = (MEMBERS[l.blk] || []).map(c => {
      const sig = sigs[c] || sigs[c.slice(2)];
      const stk = (LD.stocks || []).find(x => x.code.slice(2) === c);
      return { code: c, name: sig ? sig.name : (stk ? stk.name : c),
               pct: stk ? stk.pct : (sig ? (sig.trend5 || 0) : 0),
               isLimit: stk ? stk.pct >= 9.5 : false };
    }).filter(x => !x.isLimit && x.pct != null && x.pct < 9.5)
      .sort((a, b) => (a.pct || 0) - (b.pct || 0)).slice(0, 3);
    const candHtml = candidates.length
      ? candidates.map(c => `<span style="cursor:pointer;border:1px solid #e5e7eb;border-radius:3px;padding:0 5px;margin-right:3px;font-size:11.5px;" onclick="showSignal('${c.code}')">${c.name} <span class="${(c.pct||0) >= 0 ? 'up' : 'down'}">${(c.pct||0) >= 0 ? '+' : ''}${(c.pct||0).toFixed(1)}%</span></span>`).join("")
      : "<span style='color:var(--muted);font-size:11.5px;'>无</span>";
    html += `<tr><td>${l.blk}</td><td style="cursor:pointer;" onclick="showSignal('${l.code}')"><b>${l.name}</b></td>
      <td class="up"><b>${l.ld}板</b></td>
      <td class="${(l.pct || 0) >= 0 ? 'up' : 'down'}">${(l.pct || 0) >= 0 ? '+' : ''}${(l.pct || 0).toFixed(1)}%</td>
      <td>${candHtml}</td></tr>`;
  });
  html += "</tbody></table>";
  return html;
}

function renderSwitch() {
  const el = document.getElementById("switchBox");
  if (!el || !LD) return;
  const broke = LD.broke_list || [];
  const sigs = LD.signals || {};
  const firsts = (LD.limit_up_list || []).filter(s => (((sigs[s.code] || sigs[s.code.slice(2)]) || {}).limit_days || s.limit_days || 0) === 1);
  let html = `<div style="padding:4px 0;"><b style="color:#2fa36b;">🔻 高位退潮（炸板 ${broke.length} 只）</b>：`;
  if (broke.length) {
    html += broke.slice(0, 10).map(s => `<span style="cursor:pointer;" onclick="showSignal('${s.code}')">${s.name}(${s.pct.toFixed(1)}%)</span>`).join("、");
  } else {
    html += "<span style='color:var(--muted);'>无炸板</span>";
  }
  html += `</div><div style="padding:4px 0;"><b style="color:#c0392b;">🔺 低位接力候选（今日首板 ${firsts.length} 只）</b>：`;
  if (firsts.length) {
    html += firsts.slice(0, 12).map(s => `<span style="cursor:pointer;" onclick="showSignal('${s.code}')">${s.name}(${s.code.slice(2)})</span>`).join("、");
  } else {
    html += "<span style='color:var(--muted);'>无首板</span>";
  }
  html += "</div>";
  html += "<div style='font-size:11.5px;color:var(--muted);'>逻辑：高位连板炸板退潮时，关注低位首板的接力方向（高切低）。</div>";
  el.innerHTML = html;
}

function renderLHB() {
  const el = document.getElementById("lhbList");
  if (!el) return;
  const arr = (LD && LD.lhb) || [];
  if (!arr.length) {
    el.innerHTML = "<p style='color:var(--muted);'>龙虎榜数据盘中/盘后自动更新。</p>";
    return;
  }
  const d = document.getElementById("lhbDate");
  if (d) d.textContent = `（${arr[0].date || ""}）`;
  let html = `<table><thead><tr><th>代码</th><th>名称</th><th>净买额(亿)</th><th>涨跌</th><th>上榜原因</th></tr></thead><tbody>`;
  arr.forEach(x => {
    const net = x.net || 0;
    const p = x.chg != null ? x.chg : 0;
    html += `<tr style="cursor:pointer;" onclick="showSignal('${x.code}')"><td>${x.code}</td><td>${x.name}</td>
      <td class="${net >= 0 ? "up" : "down"}">${net >= 0 ? "+" : ""}${net.toFixed(2)}</td>
      <td class="${p >= 0 ? "up" : "down"}">${p >= 0 ? "+" : ""}${p}%</td>
      <td style="font-size:11.5px;color:var(--muted);">${x.reason || ""}</td></tr>`;
  });
  html += "</tbody></table>";
  el.innerHTML = html;
}

function renderLimits() {
  if (!LD || !LD.limit_up_list) return;
  let arr = LD.limit_up_list || [];
  arr = [...arr].sort((a, b) =>
    (((sigFor(b.code) || {}).limit_days || b.limit_days || 0) -
     ((sigFor(a.code) || {}).limit_days || a.limit_days || 0)) || (b.pct - a.pct));
  document.getElementById("limitCnt").textContent = `（${arr.length} 只，连板 ${arr.filter(s => (((sigFor(s.code) || {}).limit_days || s.limit_days || 0)) >= 1).length} 只）`;
  loadPromo();
  renderLadder(arr);
  let html = `<table><thead><tr><th>代码</th><th>名称</th><th>连板</th><th>现价</th><th>涨幅</th><th>成交额(亿)</th><th>换手</th><th>流通市值(亿)</th></tr></thead><tbody>`;
  arr.forEach(s => {
    const sg = sigFor(s.code);
    const ld = sg ? (sg.limit_days || 0) : (s.limit_days || 0);
    html += `<tr style="cursor:pointer;" onclick="showSignal('${s.code}')"><td>${s.code}</td><td>${s.name}</td>
      <td>${ld >= 1 ? `<span style="color:#c0392b;font-weight:bold;">${ld}板</span>` : "—"}</td>
      <td>${s.price.toFixed(2)}</td>
      <td class="up">+${s.pct.toFixed(2)}%</td>
      <td>${s.amount}</td>
      <td>${s.turnover.toFixed(2)}%</td>
      <td>${s.float_mv}</td></tr>`;
  });
  html += "</tbody></table>";
  document.getElementById("limitList").innerHTML = html;
}

function showBlockStocks(name) {
  if (!LD) return;
  const codes = new Set(MEMBERS[name] || []);
  const stocks = (LD.stocks || []).filter(s => {
    const raw = s.code;
    const c = (raw.slice(0,2) === "sh" || raw.slice(0,2) === "sz" || raw.slice(0,2) === "bj") ? raw.slice(2) : raw;
    return codes.has(c);
  }).sort((a, b) => b.pct - a.pct);
  const el = document.getElementById("stkList");
  document.getElementById("blkDetail").textContent = `正在看：${name}（${stocks.length} 只）`;
  if (!stocks.length) {
    el.innerHTML = "<p style='color:var(--muted);'>该板块成分数据加载中或为空。</p>";
    return;
  }
  let html = `<table><thead><tr><th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>成交额(亿)</th><th>换手率</th></tr></thead><tbody>`;
  stocks.slice(0, 100).forEach(s => {
    const cls = s.pct >= 0 ? "up" : "down";
    const sign = s.pct >= 0 ? "+" : "";
    html += `<tr><td>${s.code}</td><td>${s.name}</td>
      <td>${s.price.toFixed(2)}</td>
      <td class="${cls}">${sign}${s.pct.toFixed(2)}%</td>
      <td>${(s.amount/1e8).toFixed(1)}</td>
      <td>${s.turnover.toFixed(2)}%</td></tr>`;
  });
  html += "</tbody></table>";
  el.innerHTML = html;
}

function backToStkList() {
  document.getElementById("blkDetail").textContent = "";
  renderStocks();
}

function renderIndices() {
  if (!LD) return;
  const box = document.getElementById("idxBox");
  const names = ["上证指数", "深证成指", "创业板指", "科创50"];
  box.innerHTML = (LD.indices || []).map((i, idx) => {
    const cls = i.pct >= 0 ? "up" : "down";
    const sign = i.pct >= 0 ? "+" : "";
    return `<div class="idx"><div class="n">${names[idx] || i.name}</div>
      <div class="p ${cls}">${i.price.toFixed(2)}</div>
      <div class="c ${cls}">${sign}${i.pct.toFixed(2)}%</div></div>`;
  }).join("");
}

function renderBlocks() {
  if (!LD) return;
  const kw = document.getElementById("blkSearch").value;
  let list = (LD.blocks || []).filter(b => b.name.includes(kw));
  if (BLK_TAB === "concept") list = list.filter(b => b.type === "概念");
  else if (BLK_TAB === "style") list = list.filter(b => b.type === "风格");
  else if (BLK_TAB === "up") list = list.slice().sort((a,b) => b.pct - a.pct).slice(0, 50);
  else if (BLK_TAB === "down") list = list.slice().sort((a,b) => a.pct - b.pct).slice(0, 50);
  if (BLK_TAB === "concept" || BLK_TAB === "style") list = list.slice().sort((a,b) => b.pct - a.pct);
  const rows = list.slice(0, 80);
  let html = `<table><thead><tr><th>板块</th><th>代码</th><th>涨跌幅</th><th>成交额(亿)</th><th>成分</th></tr></thead><tbody>`;
  rows.forEach(b => {
    const cls = b.pct >= 0 ? "up" : "down";
    const sign = b.pct >= 0 ? "+" : "";
    html += `<tr style="cursor:pointer;" onclick="showBlockStocks('${b.name.replace(/'/g, "\\'")}')"><td>${b.name}</td><td>${b.code}</td>
      <td class="${cls}">${sign}${b.pct.toFixed(2)}%</td>
      <td>${(b.amount/1e8).toFixed(1)}</td><td>${b.n}/${b.total}</td></tr>`;
  });
  html += "</tbody></table>";
  document.getElementById("blkList").innerHTML = html;
}

function renderStocks() {
  if (!LD) return;
  const kw = document.getElementById("stkSearch").value.trim();
  let list = (LD.stocks || []).filter(s =>
    !kw || s.code.includes(kw) || s.name.includes(kw));
  if (STK_TAB === "up") list = list.slice().sort((a,b) => b.pct - a.pct).slice(0, 80);
  else if (STK_TAB === "down") list = list.slice().sort((a,b) => a.pct - b.pct).slice(0, 80);
  else if (STK_TAB === "amount") list = list.slice().sort((a,b) => b.amount - a.amount).slice(0, 80);
  else if (STK_TAB === "turnover") list = list.slice().sort((a,b) => b.turnover - a.turnover).slice(0, 80);
  let html = `<table><thead><tr><th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>成交额(亿)</th><th>换手率</th><th>流通市值(亿)</th></tr></thead><tbody>`;
  list.forEach(s => {
    const cls = s.pct >= 0 ? "up" : "down";
    const sign = s.pct >= 0 ? "+" : "";
    html += `<tr><td>${s.code}</td><td>${s.name}</td>
      <td>${s.price.toFixed(2)}</td>
      <td class="${cls}">${sign}${s.pct.toFixed(2)}%</td>
      <td>${(s.amount/1e8).toFixed(1)}</td>
      <td>${s.turnover.toFixed(2)}%</td>
      <td>${(s.float_mv/1e4).toFixed(0)}</td></tr>`;
  });
  html += "</tbody></table>";
  document.getElementById("stkList").innerHTML = html;
}

function setBlkTab(t) {
  BLK_TAB = t;
  document.querySelectorAll("#blkList").forEach(()=>{});
  const btns = document.querySelectorAll(".card .tabs .tab");
  renderBlocks();
  // 高亮当前 tab（简单处理：全部重画）
  const allTabs = document.querySelectorAll(".tab");
  allTabs.forEach(b => b.classList.remove("active"));
  event && event.target && event.target.classList.add("active");
}

function setStkTab(t) {
  STK_TAB = t;
  const allTabs = document.querySelectorAll(".tab");
  allTabs.forEach(b => b.classList.remove("active"));
  if (event && event.target) event.target.classList.add("active");
  renderStocks();
}

loadMembers();
loadData();
setInterval(loadData, 20000); // 每 20 秒自动刷新
</script>
