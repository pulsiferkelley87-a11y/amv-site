name: TDX Minute Fetch

on:
  workflow_dispatch:
    inputs:
      code:
        description: '股票代码（600000 / sz300071 / bj920007）'
        required: true
        default: '600000'
      date:
        description: '日期 YYYYMMDD（留空=最近交易日）'
        required: false
        default: ''
      period:
        description: '周期 7=1分钟 0=5分钟 1=15分钟 2=30分钟 3=60分钟 4=日线'
        required: false
        default: '7'
      backfill:
        description: '回填最近 N 个交易日（填了就走回填模式，忽略 code/date）'
        required: false
        default: ''
      scope:
        description: '范围：list=精选名单｜all=全市场 5500 只'
        required: false
        default: 'list'
      shard:
        description: '分片 K/N（0/8 表示 8 片里的第 0 片）；留空=不分片'
        required: false
        default: ''
  schedule:
    # 收盘后两档（GitHub cron 常被丢，第二档兜底）
    - cron: '10 8 * * 1-5'   # 北京 16:10
    - cron: '40 10 * * 1-5'  # 北京 18:40

permissions:
  contents: read

concurrency:
  group: tdx-minute-${{ github.event.inputs.shard }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_BUCKET: ${{ secrets.COS_BUCKET || 'amv-live-1500351250' }}
      COS_REGION: ${{ secrets.COS_REGION || 'ap-guangzhou' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: 闸门（今天已有分钟数据就跳过）
        id: gate
        if: github.event_name == 'schedule'
        run: python scripts/need_update.py --today-key "minute/600000/{date}/p7.json" --skip-weekend

      - name: 连通性自检（通达信 TQLEX）
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json, time, urllib.request
          t0 = time.time()
          body = json.dumps({
              "Target": 0, "Index": 0, "Range": 0, "PageIndex": 0, "PageSize": 0,
              "Code": "600000", "Setcode": 1, "Period": 7, "Startxh": 0,
              "WantNum": 5, "TQFlag": 11, "MPData": 0, "HasAttachInfo": 1,
              "HasLtgb": 0, "ForRefresh": 0, "HasIpoPrice": 0,
          }).encode()
          req = urllib.request.Request(
              "http://tdxhub.icfqs.com:7615/TQLEX?Entry=TdxShare.PBFXT",
              data=body, headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=20) as r:
              j = json.loads(r.read().decode())
          items = (j.get("ListItem") or [])
          print("OK TQLEX 可达，%.2fs，返回 %d 条" % (time.time() - t0, len(items)))
          if not items:
              raise SystemExit(1)
          PY

      - name: 取指定日分钟线（手动触发）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.backfill == ''
        env:
          CODE: ${{ github.event.inputs.code }}
          DATE: ${{ github.event.inputs.date }}
          PERIOD: ${{ github.event.inputs.period }}
        run: |
          python - <<'PY'
          import json, os, sys, datetime
          sys.path.insert(0, "scripts")
          import tdx_minute

          code = (os.environ.get("CODE") or "600000").strip()
          date = (os.environ.get("DATE") or "").strip()
          period = int(os.environ.get("PERIOD") or 7)
          if not date:
              date = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime("%Y%m%d")

          r = tdx_minute.fetch_day(code, date, verbose=True, period=period)
          bars = r["bars"]
          print("RESULT %s %s: %d 根" % (code, r["date"], len(bars)))
          os.makedirs("out", exist_ok=True)
          path = "out/minute_%s_%s_p%d.json" % (code, r["date"], period)
          open(path, "w", encoding="utf-8").write(
              json.dumps({"code": code, "date": r["date"], "period": period, "bars": bars},
                         ensure_ascii=False))
          print("written:", path)
          PY

      - name: 回填历史（手动 + 填了 backfill）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.backfill != ''
        run: |
          python scripts/warm_minute.py --backfill ${{ github.event.inputs.backfill }} \
            ${{ github.event.inputs.scope == 'all' && '--all' || '' }} \
            --shard ${{ github.event.inputs.shard }}

      - name: 批量预热（定时触发：全市场当日分时，失败重试 2 次）
        if: github.event_name == 'schedule' && steps.gate.outputs.run == 'true'
        run: |
          ok=0
          for i in 1 2; do
            echo "== 第 $i 次尝试 warm_minute --all"
            if python scripts/warm_minute.py --all; then ok=1; break; fi
            echo "失败，90 秒后重试"; sleep 90
          done
          if [ "$ok" != "1" ]; then echo "两次都失败"; exit 1; fi

      - name: 上传到 COS
        if: env.COS_SECRET_ID != ''
        run: |
          python - <<'PY'
          import base64, hashlib, hmac, json, os, sys, time, urllib.request
          sid = os.environ.get("COS_SECRET_ID", "")
          skey = os.environ.get("COS_SECRET_KEY", "")
          bucket = os.environ.get("COS_BUCKET", "")
          region = os.environ.get("COS_REGION", "ap-guangzhou")
          if not (sid and skey and bucket):
              print("跳过：未配置 COS secrets")
              raise SystemExit(0)
          if not os.path.isdir("out"):
              print("没有 out 目录（本次可能无事可做），跳过上传")
              raise SystemExit(0)
          files = sorted(os.listdir("out"))
          if not files:
              print("out 为空，跳过上传")
              raise SystemExit(0)
          host = "%s.cos.%s.myqcloud.com" % (bucket, region)
          ok = fail = 0
          for fn in files:
              base = fn.replace("minute_", "").replace(".json", "")
              parts = base.split("_")
              if len(parts) != 3:
                  continue
              key = "minute/%s/%s/%s.json" % (parts[0], parts[1], parts[2])
              body = open(os.path.join("out", fn), "rb").read()
              now = int(time.time())
              sign_time = "%d;%d" % (now - 60, now + 600)
              sign_key = hmac.new(skey.encode(), sign_time.encode(), hashlib.sha1).hexdigest()
              http_string = "put\n/%s\n\nhost=%s\n" % (key, host)
              sts = "sha1\n%s\n%s\n" % (sign_time, hashlib.sha1(http_string.encode()).hexdigest())
              sig = hmac.new(sign_key.encode(), sts.encode(), hashlib.sha1).hexdigest()
              auth = ("q-sign-algorithm=sha1&q-ak=%s&q-sign-time=%s&q-key-time=%s"
                      "&q-header-list=host&q-url-param-list=&q-signature=%s"
                      % (sid, sign_time, sign_time, sig))
              req = urllib.request.Request("https://%s/%s" % (host, key), data=body,
                                           method="PUT", headers={"Authorization": auth, "Host": host})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      ok += 1
              except Exception as e:
                  fail += 1
                  print("上传失败", key, str(e)[:80])
          print("COS 上传：成功 %d 失败 %d" % (ok, fail))
          PY
