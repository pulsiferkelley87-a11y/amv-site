name: TDX Minute Fetch

# 通达信分钟线（分时）取数 —— 全部在云端跑，不依赖任何本机进程。
#
# 触发：手动 workflow_dispatch（给 code / date），或每日收盘后定时预热。
# 产物：
#   1) 写入 Actions 日志（便于确认云端可达 + 数据正确）
#   2) 若配置了 COS_* secrets，则上传到 COS：minute/{code}/{date}/p{period}.json
#      （前端可直接读，和 live_data.json 同一条路）

on:
  workflow_dispatch:
    inputs:
      code:
        description: '股票代码（600000 / sz300071 / bj920007）'
        required: true
        default: '600000'
      date:
        description: '日期 YYYYMMDD（留空=最近交易日）'
        required: false
        default: ''
      period:
        description: '周期 7=1分钟 0=5分钟 1=15分钟 2=30分钟 3=60分钟 4=日线'
        required: false
        default: '7'
  schedule:
    # 交易日 16:10（北京时间 = UTC 08:10）预热最近一个交易日
    - cron: '10 8 * * 1-5'

permissions:
  contents: read

concurrency:
  group: tdx-minute
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # secrets 上下文不能用在 if 里，只能放 env；这里统一注入，步骤里用 env.COS_SECRET_ID 判断
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_BUCKET: ${{ secrets.COS_BUCKET || 'amv-live-1500351250' }}
      COS_REGION: ${{ secrets.COS_REGION || 'ap-guangzhou' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: 连通性自检（通达信 TQLEX 是否可达）
        run: |
          python - <<'PY'
          import json, time, urllib.request
          t0 = time.time()
          body = json.dumps({
              "Target": 0, "Index": 0, "Range": 0, "PageIndex": 0, "PageSize": 0,
              "Code": "600000", "Setcode": 1, "Period": 7, "Startxh": 0,
              "WantNum": 5, "TQFlag": 11, "MPData": 0, "HasAttachInfo": 1,
              "HasLtgb": 0, "ForRefresh": 0, "HasIpoPrice": 0,
          }).encode()
          req = urllib.request.Request(
              "http://tdxhub.icfqs.com:7615/TQLEX?Entry=TdxShare.PBFXT",
              data=body, headers={"Content-Type": "application/json"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  j = json.loads(r.read().decode())
              items = (j.get("ListItem") or [])
              print("OK TQLEX 可达，%.2fs，返回 %d 条" % (time.time() - t0, len(items)))
              if items:
                  print("样例:", items[-1].get("Item"))
          except Exception as e:
              print("FAIL TQLEX 不可达:", str(e)[:200])
              raise SystemExit(1)
          PY

      - name: 取指定日分钟线
        env:
          CODE: ${{ github.event.inputs.code }}
          DATE: ${{ github.event.inputs.date }}
          PERIOD: ${{ github.event.inputs.period }}
        run: |
          python - <<'PY'
          import json, os, sys, datetime
          sys.path.insert(0, "scripts")
          import tdx_minute

          code = (os.environ.get("CODE") or "600000").strip()
          date = (os.environ.get("DATE") or "").strip()
          period = int(os.environ.get("PERIOD") or 7)
          if not date:
              date = datetime.datetime.utcnow().strftime("%Y%m%d")   # 定时触发时的近似

          r = tdx_minute.fetch_day(code, date, verbose=True, period=period)
          bars = r["bars"]
          print("RESULT %s %s: %d 根" % (code, r["date"], len(bars)))
          if bars:
              print("first:", bars[0])
              print("last :", bars[-1])
          os.makedirs("out", exist_ok=True)
          path = "out/minute_%s_%s_p%d.json" % (code, r["date"], period)
          open(path, "w", encoding="utf-8").write(
              json.dumps({"code": code, "date": r["date"], "period": period, "bars": bars},
                         ensure_ascii=False))
          print("written:", path)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("path=%s\n" % path)
              f.write("n=%d\n" % len(bars))
          PY

      - name: 上传到 COS（仓库已有 COS_SECRET_ID/KEY；bucket/region 有默认值）
        if: env.COS_SECRET_ID != ''
        run: |
          python - <<'PY'
          import base64, hashlib, hmac, json, os, time, urllib.request
          sid = os.environ.get("COS_SECRET_ID", "")
          skey = os.environ.get("COS_SECRET_KEY", "")
          bucket = os.environ.get("COS_BUCKET", "")
          region = os.environ.get("COS_REGION", "ap-guangzhou")
          if not (sid and skey and bucket):
              print("跳过：未配置 COS secrets")
              raise SystemExit(0)
          host = "%s.cos.%s.myqcloud.com" % (bucket, region)
          for fn in os.listdir("out"):
              base = fn.replace("minute_", "").replace(".json", "")   # 600000_20260915_p7
              parts = base.split("_")
              key = "minute/%s/%s/%s.json" % (parts[0], parts[1], parts[2])
              body = open(os.path.join("out", fn), "rb").read()
              now = int(time.time())
              sign_time = "%d;%d" % (now - 60, now + 600)
              key_time = sign_time
              sign_key = hmac.new(skey.encode(), key_time.encode(), hashlib.sha1).hexdigest()
              http_string = "put\n/%s\n\nhost=%s\n" % (key, host)
              string_to_sign = "sha1\n%s\n%s\n" % (sign_time, hashlib.sha1(http_string.encode()).hexdigest())
              sig = hmac.new(sign_key.encode(), string_to_sign.encode(), hashlib.sha1).hexdigest()
              auth = "q-sign-algorithm=sha1&q-ak=%s&q-sign-time=%s&q-key-time=%s&q-header-list=host&q-url-param-list=&q-signature=%s" % (
                  sid, sign_time, key_time, sig)
              req = urllib.request.Request("https://%s/%s" % (host, key), data=body, method="PUT",
                                           headers={"Authorization": auth, "Host": host})
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("COS %s -> %s" % (key, r.status))
          PY
