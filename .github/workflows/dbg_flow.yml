name: DBG flow sources
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          python3 - <<'PY'
          import json,urllib.request,time
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          def get(u,ref=None):
              h={"User-Agent":UA,"Accept":"*/*"}
              if ref: h["Referer"]=ref
              r=urllib.request.Request(u,headers=h)
              with urllib.request.urlopen(r,timeout=15) as x:
                  return x.status, x.read()[:400]
          tests=[
            ("em_hist","https://push2his.eastmoney.com/api/qt/stock/fflow/daykline/get?lmt=0&klt=101&secid=1.600031&fields1=f1,f2,f3,f7&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61","https://quote.eastmoney.com/"),
            ("em_now","https://push2.eastmoney.com/api/qt/stock/get?secid=1.600031&fields=f43,f57,f58,f62,f184","https://quote.eastmoney.com/"),
            ("tencent_ff","https://qt.gtimg.cn/q=ff_sh600031","https://gu.qq.com/"),
            ("sina","https://hq.sinajs.cn/list=sh600031","https://finance.sina.com.cn/"),
          ]
          for name,u,ref in tests:
              try:
                  st,body=get(u,ref)
                  print(name,"status",st, body[:180].decode("utf-8","replace").replace("\n"," "))
              except Exception as e:
                  print(name,"ERR",type(e).__name__,str(e)[:120])
              time.sleep(2)
          PY
