name: Daily Update

on:
  schedule:
    - cron: '35 7 * * *'          # 北京 15:35 主跑
    - cron: '0 8,9 * * *'         # 北京 16:00 / 17:00 兜底
    - cron: '0 10,11,12,13 * * 1-5'  # 北京 18:00 / 19:00 / 20:00 / 21:00 补跑
  workflow_dispatch: {}

concurrency:
  group: amv-data
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 闸门（今天的数据已经更新过就整轮跳过）
        id: gate
        if: github.event_name == 'schedule'
        run: python scripts/need_update.py bull_bear.json --field trade_date --skip-weekend

      - name: Install deps
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: pip install requests

      - name: Fetch fundamentals
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: python scripts/fetch_fundamentals.py --workers 10 || echo "fundamentals fetch failed, continue"
        timeout-minutes: 10

      - name: Update data（失败重试 2 次）
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        timeout-minutes: 50
        env:
          TOP_N: '1500'
          TOP_BY: 'stalest'
          FETCH_WORKERS: '8'
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: amv-live-1500351250
          COS_REGION: ap-guangzhou
        run: |
          ok=0
          for i in 1 2; do
            echo "== 第 $i 次尝试 update_cloud.py"
            if python scripts/update_cloud.py; then ok=1; break; fi
            echo "失败，60 秒后重试"; sleep 60
          done
          if [ "$ok" != "1" ]; then echo "两次都失败"; exit 1; fi

      - name: 生成股票名称表并上传（新股自动进搜索）
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: amv-live-1500351250
          COS_REGION: ap-guangzhou
        run: python scripts/build_names_cos.py

      - name: Commit data
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: |
          git config user.name "amv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto update $(date -u +%F)"
            for i in 1 2 3 4 5; do
              if git pull --rebase -X ours --no-edit origin main && git push; then
                echo "pushed"
                break
              fi
              sleep 5
            done
          fi

      - name: Prepare publish directory (root-level files only)
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: |
          mkdir -p _site
          find . -maxdepth 1 -type f \
            ! -name 'chan_scan.json' ! -name 'bull_bear.json' \
            ! -name 'breadth_history.json' ! -name 'news.json' \
            -exec cp {} _site/ \;

      - name: Upload static site to Tencent COS
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: amv-live-1500351250
          COS_REGION: ap-guangzhou
        run: |
          pip install cos-python-sdk-v5 -q
          python scripts/upload_cos.py

      - name: Setup Pages
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

  # 缠论扫描兜底：chan.yml 自己的 cron 若没被 GitHub 触发，就由本 job 代打一次
  kick-chan:
    needs: update
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: 检查今天有没有跑过缠论扫描
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.request

          pat = os.environ.get("GH_PAT", "")
          if not pat:
              print("没有 GH_PAT，跳过兜底")
              raise SystemExit(0)

          base = "https://api.github.com/repos/pulsiferkelley87-a11y/amv-site"
          hdr = {
              "Authorization": "Bearer " + pat,
              "Accept": "application/vnd.github+json",
              "User-Agent": "amv-kick",
          }

          def get(url):
              return json.loads(urllib.request.urlopen(
                  urllib.request.Request(url, headers=hdr), timeout=30).read().decode())

          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          runs = get(base + "/actions/workflows/chan.yml/runs?per_page=10")["workflow_runs"]
          ran = [w for w in runs if w["created_at"][:10] == today
                 and w["status"] in ("queued", "in_progress", "completed")]
          print("今天 chan.yml 运行次数:", len(ran))

          if ran:
              print("今天已经跑过，不重复触发")
              raise SystemExit(0)

          req = urllib.request.Request(
              base + "/actions/workflows/chan.yml/dispatches",
              data=json.dumps({"ref": "main"}).encode(),
              method="POST",
              headers={**hdr, "Content-Type": "application/json"},
          )
          print("兜底 dispatch 状态:", urllib.request.urlopen(req, timeout=30).status)
          PY
