name: Daily Update

on:
  schedule:
    - cron: '35 7 * * *'     # UTC 07:35 = 北京 15:35（避开 light 的 :30 并发写仓库）
    - cron: '0 8,9 * * *'    # UTC 08:00/09:00 = 北京 16:00/17:00 兜底（GitHub 调度常漏）
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Update data
        run: python scripts/update_cloud.py
        timeout-minutes: 50
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: amv-live-1500351250
          COS_REGION: ap-guangzhou

      - name: Commit data
        run: |
          git config user.name "amv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto update $(date -u +%F)"
            for i in 1 2 3 4 5; do
              if git pull --rebase -X ours --no-edit origin main && git push; then
                echo "pushed"
                break
              fi
              sleep 5
            done
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
