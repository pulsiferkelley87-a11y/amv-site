name: Chan Scan

# 全市场缠论扫描：收盘后 dump 5200+ 只日线 → 引擎扫描 → chan_scan.json + 池内 K 线
on:
  schedule:
    - cron: '20 10 * * 1-5'   # 北京 18:20 主跑
    - cron: '0 13 * * 1-5'    # 北京 21:00 兜底
    - cron: '30 14 * * 1-5'   # 北京 22:30 再兜一次
  workflow_dispatch: {}

concurrency:
  group: amv-chan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_BUCKET: amv-live-1500351250
      COS_REGION: ap-guangzhou
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 闸门（今天已扫过就跳过）
        id: gate
        if: github.event_name == 'schedule'
        run: python scripts/need_update.py chan_scan.json --field updated_at --skip-weekend

      - name: Install deps
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: pip install requests cos-python-sdk-v5 -q

      - name: Dump daily bars
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        env:
          CLOUD_DIR: .
          CHAN_BARS: _chan/bars
        run: python scripts/chan_dump_bars.py

      - name: Scan
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        env:
          CLOUD_DIR: .
          CHAN_BARS: _chan/bars
          CHAN_OUT: _chan/out
        run: node scripts/chan_scan_offline.mjs

      - name: Copy result
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: cp _chan/out/chan_scan.json chan_scan.json

      - name: Upload to COS
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: python scripts/chan_upload.py

      - name: Print summary
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: python scripts/chan_summary.py

      - name: Commit
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: |
          git config user.name "amv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add chan_scan.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chan scan $(date -u +%F)"
            for i in 1 2 3; do
              if git pull --rebase -X ours --no-edit origin main && git push; then break; fi
              sleep 5
            done
          fi
