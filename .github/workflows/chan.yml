name: Chan Scan

# 全市场缠论扫描：收盘后把 5000+ 只日线 dump → 引擎扫描 → chan_scan.json + 信号池 K 线
# 北京 18:20（主）/ 21:00（兜底），仅工作日；也可手动触发。
on:
  schedule:
    - cron: '20 10 * * 1-5'
    - cron: '0 13 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: amv-chan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: pip install requests cos-python-sdk-v5 -q

      - name: Dump daily bars
        run: python scripts/chan_dump_bars.py
        timeout-minutes: 20
        env:
          CLOUD_DIR: .
          CHAN_BARS: _chan/bars

      - name: Scan market
        run: node scripts/chan_scan_offline.mjs
        timeout-minutes: 10
        env:
          CLOUD_DIR: .
          CHAN_BARS: _chan/bars
          CHAN_OUT: _chan/out

      - name: Publish json to repo root
        run: cp _chan/out/chan_scan.json chan_scan.json

      - name: Upload to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: amv-live-1500351250
          COS_REGION: ap-guangzhou
        run: python scripts/chan_upload.py

      - name: Commit chan_scan.json
        run: |
          git config user.name "amv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add chan_scan.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chan scan $(date -u +%F_%H%M)"
            for i in 1 2 3; do
              if git pull --rebase -X ours --no-edit origin main && git push; then break; fi
              sleep 5
            done
          fi

      - name: Summary
        if: always()
        run: python scripts/chan_summary.py
