name: Health Check

on:
  schedule:
    - cron: '4,19,34,49 * * * *'   # 每 15 分钟（与 deploy 的 7,22,37,52 错开 3 分钟）
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # 允许补跑 daily
  pages: write
  id-token: write

concurrency:
  group: health-check   # 独立队列：不被 Pages Deploy 的 cancel-in-progress 取消
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub 的 cron 在高峰期会被丢弃/延迟数小时（今天 daily 三次全丢，light 也少了十几轮）。
      # 这里每 15 分钟对一次账：bull_bear 的归属日落后于"最近已收盘交易日"就补跑一次 daily。
      - name: Catch up daily when bull_bear is stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime, timedelta, timezone
          repo = os.environ["GITHUB_REPOSITORY"]
          tok = os.environ["GH_TOKEN"]
          now = datetime.now(timezone.utc) + timedelta(hours=8)   # 北京
          d = now.date()
          if now.hour < 15 or (now.hour == 15 and now.minute < 5):
              d -= timedelta(days=1)
          if d.weekday() == 5:
              d -= timedelta(days=1)
          elif d.weekday() == 6:
              d -= timedelta(days=2)
          want = str(d)
          try:
              have = json.load(open("bull_bear.json", encoding="utf-8")).get("trade_date") or ""
          except Exception:
              have = ""
          print("bull_bear want=%s have=%s" % (want, have))
          if have >= want:
              print("已是最新，跳过"); sys.exit(0)
          hdr = {"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json", "User-Agent": "amv-catchup"}
          req = urllib.request.Request("https://api.github.com/repos/%s/actions/workflows/daily.yml/runs?status=in_progress" % repo, headers=hdr)
          with urllib.request.urlopen(req, timeout=30) as r:
              n = len(json.loads(r.read().decode()).get("workflow_runs") or [])
          if n:
              print("已有 %d 个 daily 在跑，跳过" % n); sys.exit(0)
          # 限流：1 小时内已经触发过就不再补。否则 pending 会被新触发反复顶掉，
          # 一轮都跑不完（实测 12 分钟内连开 8 次、全部取消）。
          reqr = urllib.request.Request(
              "https://api.github.com/repos/%s/actions/workflows/daily.yml/runs?per_page=10" % repo, headers=hdr)
          with urllib.request.urlopen(reqr, timeout=30) as r:
              _runs = json.loads(r.read().decode()).get("workflow_runs") or []
          _now = datetime.now(timezone.utc)
          _recent = [x for x in _runs
                     if (_now - datetime.fromisoformat(x["created_at"].replace("Z", "+00:00"))).total_seconds() < 3600]
          if _recent:
              print("1 小时内已有 %d 次 daily 运行，本轮不补跑" % len(_recent)); sys.exit(0)
          hdr2 = dict(hdr); hdr2["Content-Type"] = "application/json"
          req2 = urllib.request.Request("https://api.github.com/repos/%s/actions/workflows/daily.yml/dispatches" % repo,
                                         data=json.dumps({"ref": "main"}).encode(), method="POST", headers=hdr2)
          with urllib.request.urlopen(req2, timeout=30) as r:
              print("已补跑 daily，HTTP", r.status)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Health check (3 sources + cross validation)
        run: python scripts/health_check.py || echo "health check failed, continue"

      - name: Commit health data
        run: |
          git config user.name "amv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add health.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "health update $(date -u +%F-%H%M%S)" || true
            timeout 60 git pull --rebase -X ours --no-edit origin main || true
            timeout 60 git push || true
          fi

      - name: Prepare publish directory (root-level files only)
        run: |
          mkdir -p _site
          find . -maxdepth 1 -type f -exec cp {} _site/ \;
          ls _site | wc -l

      - name: Upload static site to Tencent COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: amv-live-1500351250
          COS_REGION: ap-guangzhou
        run: |
          pip install cos-python-sdk-v5
          python scripts/upload_cos.py

      - name: Publish to Cloudflare Pages
        continue-on-error: true   # CF 是备胎通道，失败不阻塞 COS 主通道
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy _site --project-name=amv-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
