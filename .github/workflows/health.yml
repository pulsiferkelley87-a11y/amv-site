name: Health Check

on:
  schedule:
    - cron: '4,19,34,49 * * * *'   # 每 15 分钟（与 deploy 的 7,22,37,52 错开 3 分钟）
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-live
  cancel-in-progress: false   # 与 Pages Deploy 共用队列，不互相取消

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Health check (3 sources + cross validation)
        run: python scripts/health_check.py || echo "health check failed, continue"

      - name: Commit health data
        run: |
          git config user.name "amv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add health.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "health update $(date -u +%F-%H%M%S)" || true
            timeout 60 git pull --rebase -X ours --no-edit origin main || true
            timeout 60 git push || true
          fi

      - name: Prepare publish directory (root-level files only)
        run: |
          mkdir -p _site
          find . -maxdepth 1 -type f -exec cp {} _site/ \;
          ls _site | wc -l

      - name: Upload static site to Tencent COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: amv-live-1500351250
          COS_REGION: ap-guangzhou
        run: |
          pip install cos-python-sdk-v5
          python scripts/upload_cos.py

      - name: Publish to Cloudflare Pages
        continue-on-error: true   # CF 是备胎通道，失败不阻塞 COS 主通道
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy _site --project-name=amv-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
