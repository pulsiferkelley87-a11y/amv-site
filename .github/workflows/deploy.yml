name: Pages Deploy (with fallback fetch)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '7,22,37,52 * * * *'   # 每15分钟兜底：即使循环任务全死，也抓一次新数据并部署

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-live
  cancel-in-progress: true   # 只保留最新部署，不积压

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Fallback fetch latest data
        if: github.event_name == 'schedule'
        run: |
          python scripts/live_update.py || echo "fallback fetch failed, deploy existing data"
          git config user.name "amv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add live_data.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fallback live update $(date -u +%F-%H%M%S)" || true
            timeout 60 git pull --rebase -X ours --no-edit origin main || true
            timeout 60 git push || true
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
