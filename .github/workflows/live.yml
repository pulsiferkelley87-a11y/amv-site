name: Live Snapshot (5min)

on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分钟
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Fetch live snapshot
        run: python scripts/live_update.py
        timeout-minutes: 8

      - name: Commit live data
        run: |
          git config user.name "amv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add live_data.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "live update $(date -u +%F-%H%M)"
            for i in 1 2 3 4 5; do
              if git pull --rebase -X ours --no-edit origin main && git push; then
                echo "pushed"
                break
              fi
              sleep 5
            done
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
