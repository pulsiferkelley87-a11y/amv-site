name: Live Snapshot (1min loop)

on:
  schedule:
    - cron: '4 * * * *'   # 每小时第4分触发，run 内循环 ~55 分钟
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: live-loop
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Loop fetch & push (per minute)
        run: |
          git config user.name "amv-bot"
          git config user.email "bot@users.noreply.github.com"
          for i in $(seq 1 50); do
            echo "--- round $i $(date -u +%H:%M:%S) ---"
            python scripts/live_update.py || echo "fetch fail (round $i)"
            git add live_data.json
            if git diff --cached --quiet; then
              echo "no changes"
            else
              git commit -m "live update $(date -u +%F-%H%M%S)"
              for t in 1 2 3 4 5; do
                if git pull --rebase -X ours --no-edit origin main && git push; then
                  echo "pushed"
                  break
                fi
                sleep 4
              done
            fi
            # 每 3 分钟 dispatch 一次部署（部署 ~1.5min，不积压）
            if [ $((i % 3)) -eq 0 ]; then
              curl -s -X POST \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
                -d '{"ref":"main"}'
              echo "deploy dispatched"
            fi
            sleep 26
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
