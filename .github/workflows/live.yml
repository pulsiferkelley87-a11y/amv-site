name: Live Snapshot (loop)

on:
  schedule:
    - cron: '2,17,32,47 * * * *'   # 每15分钟一个 cron 点，run 内循环 ~8 分钟
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: live-loop
  cancel-in-progress: false   # 延迟时排在后面的 run 靠『新鲜度闸门』秒退，不再自我取消

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Fresh gate（6 分钟内刚更新过就跳过这一轮）
        id: fresh
        run: python scripts/need_update.py live_data.json --field updated_at --max-age-min 6

      # 兜底触发器：本 job 有 actions:write，可代打 daily / chan（不依赖 GH_PAT）
      - name: Stale checks → dispatch daily / chan（整轮只查一次）
        if: steps.fresh.outputs.run == 'true'
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date -u +%H)" -lt "8" ]; then
            echo "before 16:05 Beijing, skip dispatch checks"
            exit 0
          fi
          if [ "$(date -u +%u)" -ge "6" ]; then
            echo "weekend, skip dispatch checks"
            exit 0
          fi
          if ! python scripts/check_daily_stale.py; then
            curl -s -X POST \
              -H "Authorization: Bearer $GH" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily.yml/dispatches" \
              -d '{"ref":"main"}'
            echo "daily stale -> dispatched"
          else
            echo "daily fresh"
          fi
          if python scripts/need_update.py chan_scan.json --field updated_at --skip-weekend --min-time 15:00 | grep -q "run=true"; then
            curl -s -X POST \
              -H "Authorization: Bearer $GH" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/chan.yml/dispatches" \
              -d '{"ref":"main"}'
            echo "chan stale -> dispatched"
          else
            echo "chan fresh"
          fi

      - name: Loop fetch & push (per minute)
        if: steps.fresh.outputs.run == 'true'
        run: |
          git config user.name "amv-bot"
          git config user.email "bot@users.noreply.github.com"
          for i in $(seq 1 8); do
            echo "--- round $i $(date -u +%H:%M:%S) ---"
            python scripts/live_update.py || echo "fetch fail or partial (round $i)"
            git add live_data.json
            if git diff --cached --quiet; then
              echo "no changes"
            else
              git commit -m "live update $(date -u +%F-%H%M%S)"
              for t in 1 2 3; do
                if timeout 60 git pull --rebase -X ours --no-edit origin main && timeout 60 git push; then
                  echo "pushed"
                  break
                fi
                sleep 4
              done
            fi
            # 每分钟 dispatch 部署（deploy.yml 用 cancel-in-progress 只留最新）
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
              -d '{"ref":"main"}'
            echo "deploy dispatched"
            sleep 42
          done
