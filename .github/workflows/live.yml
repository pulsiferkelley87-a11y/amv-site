name: Live Snapshot (loop)

on:
  schedule:
    - cron: '2,17,32,47 * * * *'   # 每15分钟一个 cron 点，run 内循环 ~12 分钟；挂掉最多 15 分钟自动重启
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: live-loop
  cancel-in-progress: true   # 新 run 立即接管，不排队积压

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Loop fetch & push (per minute)
        run: |
          git config user.name "amv-bot"
          git config user.email "bot@users.noreply.github.com"
          for i in $(seq 1 11); do
            echo "--- round $i $(date -u +%H:%M:%S) ---"
            python scripts/live_update.py || echo "fetch fail or partial (round $i)"
            git add live_data.json
            if git diff --cached --quiet; then
              echo "no changes"
            else
              git commit -m "live update $(date -u +%F-%H%M%S)"
              for t in 1 2 3; do
                if timeout 60 git pull --rebase -X ours --no-edit origin main && timeout 60 git push; then
                  echo "pushed"
                  break
                fi
                sleep 4
              done
            fi
            # 收盘后（UTC>=8h）若主页数据停留在昨天 → 触发 daily 全量
            if [ "$(date -u +%H)" -ge "8" ] && ! python scripts/check_daily_stale.py; then
              curl -s -X POST \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily.yml/dispatches \
                -d '{"ref":"main"}'
              echo "daily stale -> dispatched"
            fi
            # 每分钟 dispatch 部署（deploy.yml 用 cancel-in-progress 只留最新）
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
              -d '{"ref":"main"}'
            echo "deploy dispatched"
            sleep 42
          done
