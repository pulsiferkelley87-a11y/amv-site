name: TDX Flow Warm

on:
  workflow_dispatch:
    inputs:
      codes:
        description: '逗号分隔股票代码（留空=全市场）'
        required: false
        default: ''
      limit:
        description: '只跑前 N 只（调试用）'
        required: false
        default: ''
  schedule:
    # 收盘后多档兜底（GitHub 的 cron 经常被丢弃/延迟）
    - cron: '20 8 * * 1-5'    # 北京 16:20
    - cron: '50 9 * * 1-5'    # 北京 17:50
    - cron: '30 11 * * 1-5'   # 北京 19:30
    - cron: '30 13 * * 1-5'   # 北京 21:30

concurrency:
  group: tdx-flow
  cancel-in-progress: false

jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_BUCKET: ${{ secrets.COS_BUCKET || 'amv-live-1500351250' }}
      COS_REGION: ${{ secrets.COS_REGION || 'ap-guangzhou' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 闸门（今天已更新就跳过）
        id: gate
        if: github.event_name == 'schedule'
        run: python scripts/need_update.py flow/600031.json --skip-weekend

      - name: 连通性自检（东财资金流）
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json, urllib.request
          u = ("https://push2his.eastmoney.com/api/qt/stock/fflow/daykline/get"
               "?lmt=0&klt=101&secid=1.600000&fields1=f1,f2,f3,f7"
               "&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61")
          r = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0",
                                                 "Referer": "https://quote.eastmoney.com/"})
          j = json.loads(urllib.request.urlopen(r, timeout=20).read().decode())
          kl = ((j.get("data") or {}).get("klines")) or []
          print("东财资金流可达，样例返回", len(kl), "天")
          if not kl:
              raise SystemExit("东财返回空数据")
          PY

      - name: 抓主力资金日线并写 COS（失败重试 3 次）
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        env:
          INPUT_CODES: ${{ github.event.inputs.codes }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          ARGS="--workers 4"
          if [ -n "$INPUT_CODES" ]; then ARGS="$ARGS --codes $INPUT_CODES"; fi
          if [ -n "$INPUT_LIMIT" ]; then ARGS="$ARGS --limit $INPUT_LIMIT"; fi
          ok=0
          for i in 1 2 3; do
            echo "== 第 $i 次尝试：python scripts/warm_flow.py $ARGS"
            if python scripts/warm_flow.py $ARGS; then ok=1; break; fi
            echo "第 $i 次失败，60 秒后重试"; sleep 60
          done
          if [ "$ok" != "1" ]; then echo "三次都失败"; exit 1; fi
