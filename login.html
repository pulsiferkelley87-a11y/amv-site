<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 缠中说禅看盘</title>
<style>
  :root{
    --bg:#05070d; --card:rgba(17,24,39,.72); --line:rgba(148,163,184,.18);
    --fg:#e5e7eb; --dim:#94a3b8; --acc:#6366f1; --acc2:#22d3ee; --bad:#f87171;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  #bg{position:fixed;inset:0;display:block}
  .glow{position:fixed;width:60vw;height:60vw;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none}
  .glow.a{left:-18vw;top:-22vw;background:radial-gradient(circle,#4338ca,transparent 62%)}
  .glow.b{right:-22vw;bottom:-26vw;background:radial-gradient(circle,#0891b2,transparent 62%)}

  .wrap{
    position:relative;z-index:2;height:100%;display:grid;
    grid-template-columns:1.05fr .95fr;align-items:center;
    padding:clamp(20px,4vw,64px);gap:clamp(20px,4vw,72px);
  }
  .brand{max-width:520px}
  .brand .mark{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--acc2);box-shadow:0 0 18px var(--acc2)}
  .brand h1{
    font-size:clamp(26px,3.2vw,42px);line-height:1.18;margin:0 0 14px;letter-spacing:-.4px;
    background:linear-gradient(96deg,#e2e8f0,#a5b4fc 45%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand p{margin:0;color:var(--dim);font-size:clamp(13px,1.1vw,15px);line-height:1.85}
  .brand ul{margin:20px 0 0;padding:0;list-style:none;display:grid;gap:9px}
  .brand li{color:#b6c2d4;font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
  .brand li b{color:#7dd3fc;font-weight:600}

  .card{
    width:100%;max-width:400px;justify-self:center;position:relative;
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:30px 28px 26px;backdrop-filter:blur(18px) saturate(1.2);
    box-shadow:0 30px 70px -20px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.05);
    transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s;
  }
  .card.shake{animation:shake .38s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
    40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}
  }
  .card h2{margin:0 0 6px;font-size:19px;font-weight:600;letter-spacing:.2px}
  .card .sub{margin:0 0 22px;color:var(--dim);font-size:12.5px}

  .fld{position:relative;margin-bottom:14px}
  .fld input{
    width:100%;height:46px;padding:0 14px 0 40px;border-radius:12px;
    background:rgba(2,6,23,.62);border:1px solid var(--line);color:var(--fg);
    font-size:14px;outline:none;transition:border-color .18s,box-shadow .18s,background .18s;
  }
  .fld input:focus{border-color:rgba(99,102,241,.85);box-shadow:0 0 0 3px rgba(99,102,241,.18);background:rgba(2,6,23,.85)}
  .fld input::placeholder{color:#64748b}
  .fld .ico{position:absolute;left:13px;top:0;height:46px;display:flex;align-items:center;color:#64748b}
  .fld svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}

  .row{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px;font-size:12.5px;color:var(--dim)}
  .row label{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
  .row input[type=checkbox]{accent-color:var(--acc);width:14px;height:14px}

  button.submit{
    width:100%;height:46px;border:0;border-radius:12px;cursor:pointer;position:relative;overflow:hidden;
    background:linear-gradient(100deg,#4f46e5,#6366f1 40%,#0ea5e9);color:#fff;font-size:14.5px;font-weight:600;
    letter-spacing:.3px;transition:transform .12s,filter .18s;
  }
  button.submit:hover{filter:brightness(1.08)}
  button.submit:active{transform:scale(.985)}
  button.submit[disabled]{opacity:.75;cursor:default}
  button.submit .spin{
    width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;display:inline-block;vertical-align:-3px;margin-right:8px;
    animation:sp .7s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}

  .msg{margin-top:14px;min-height:18px;font-size:12.5px;color:var(--bad);text-align:center;opacity:0;transition:opacity .2s}
  .msg.on{opacity:1}
  .hint{margin-top:16px;font-size:11.5px;color:#64748b;text-align:center;line-height:1.7}

  /* 成功过场 */
  .ok{
    position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(34,211,238,.13),transparent 55%),#05070d;
    opacity:0;pointer-events:none;transition:opacity .45s;
  }
  .ok.on{opacity:1;pointer-events:auto}
  .ok .ring{
    width:74px;height:74px;border-radius:50%;border:2px solid rgba(34,211,238,.25);
    border-top-color:#22d3ee;animation:sp 1s linear infinite;margin:0 auto 18px;
  }
  .ok .say{text-align:center;color:#cbd5e1;font-size:14px;letter-spacing:.5px}
  .ok .say b{display:block;font-size:18px;color:#fff;margin-bottom:6px}

  @media (max-width:820px){
    .wrap{grid-template-columns:1fr;align-content:center;gap:26px;padding:22px 18px}
    .brand{max-width:none;text-align:center}
    .brand ul{display:none}
    .brand h1{font-size:26px}
    .card{max-width:420px;padding:26px 20px 22px}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="glow a"></div><div class="glow b"></div>

<main class="wrap">
  <section class="brand">
    <div class="mark"><span class="dot"></span><span style="color:#94a3b8;font-size:13px;letter-spacing:2px">CHAN · A股看盘</span></div>
    <h1>缠论结构 · 实盘监测<br>一个入口看完</h1>
    <p>全市场 5,000+ 只 A 股的笔 / 线段 / 中枢 / 买卖点，每天收盘后自动重算；实时指数、涨停池、主力净流入与市场宽度同页可查。</p>
    <ul>
      <li><b>·</b> 纯本地渲染，不记录访问轨迹</li>
      <li><b>·</b> 账号由管理员预先开通，不开放自助注册</li>
      <li><b>·</b> 登录状态默认保留 7 天</li>
    </ul>
  </section>

  <section class="card" id="card">
    <h2>账号登录</h2>
    <p class="sub">请输入管理员给你开通的账号</p>

    <form id="form" autocomplete="on">
      <div class="fld">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8z"/><path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6"/></svg></span>
        <input id="u" name="username" placeholder="账号" autocomplete="username" required>
      </div>
      <div class="fld">
        <span class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg></span>
        <input id="p" name="password" type="password" placeholder="密码" autocomplete="current-password" required>
      </div>
      <div class="row">
        <label><input type="checkbox" id="r" checked> 记住我（7 天）</label>
        <span style="opacity:.7">忘记密码请联系管理员</span>
      </div>
      <button class="submit" id="go" type="submit">登 录</button>
      <div class="msg" id="msg"></div>
      <div class="hint">账号未开通？把要用的用户名告诉管理员，开通后即可登录。</div>
    </form>
  </section>
</main>

<div class="ok" id="ok">
  <div>
    <div class="ring"></div>
    <div class="say"><b id="okName">登录成功</b>正在进入看盘台…</div>
  </div>
</div>

<script src="auth.js"></script>
<script>
(function () {
  /* ---------- 背景动画：粒子星链 ---------- */
  const cv = document.getElementById("bg");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);
  let pts = [];

  function resize() {
    W = cv.width = innerWidth * DPR;
    H = cv.height = innerHeight * DPR;
    cv.style.width = innerWidth + "px";
    cv.style.height = innerHeight + "px";
    const n = Math.round(Math.min(120, Math.max(46, innerWidth / 14)));
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .28 * DPR, vy: (Math.random() - .5) * .28 * DPR,
      r: (Math.random() * 1.6 + .6) * DPR,
    }));
  }
  resize();
  addEventListener("resize", resize);

  let mx = -1e4, my = -1e4;
  addEventListener("pointermove", (e) => { mx = e.clientX * DPR; my = e.clientY * DPR; });
  addEventListener("pointerleave", () => { mx = my = -1e4; });

  const LINK = 128 * DPR;

  function frame() {
    ctx.clearRect(0, 0, W, H);
    // 缓慢流动的网格
    ctx.strokeStyle = "rgba(99,102,241,.055)";
    ctx.lineWidth = 1 * DPR;
    const gs = 64 * DPR, off = (performance.now() / 90) % gs;
    ctx.beginPath();
    for (let x = -off; x < W; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = -off; y < H; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;

      const dmx = p.x - mx, dmy = p.y - my;
      const dm = Math.hypot(dmx, dmy);
      if (dm < 130 * DPR) { p.x += (dmx / (dm || 1)) * .7; p.y += (dmy / (dm || 1)) * .7; }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = "rgba(148,197,255,.55)";
      ctx.fill();
    }

    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const a = pts[i], b = pts[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < LINK) {
          ctx.strokeStyle = "rgba(99,102,241," + (0.22 * (1 - d / LINK)).toFixed(3) + ")";
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- 登录逻辑 ---------- */
  const form = document.getElementById("form");
  const card = document.getElementById("card");
  const msg = document.getElementById("msg");
  const go = document.getElementById("go");
  const okBox = document.getElementById("ok");
  const okName = document.getElementById("okName");

  const next = new URLSearchParams(location.search).get("next") || "all.html";

  function fail(t) {
    msg.textContent = t;
    msg.classList.add("on");
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
  }

  // 已登录则直接放行
  (async function () {
    const s = AUTH.session();
    if (s && s.x > Date.now()) {
      try {
        const acc = await AUTH.loadAccounts();
        if (await AUTH.isValid(s, acc)) location.replace(next);
      } catch (e) {}
    }
    const u = localStorage.getItem("amv_last_user");
    if (u) { document.getElementById("u").value = u; document.getElementById("p").focus(); }
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.classList.remove("on");
    const u = document.getElementById("u").value.trim();
    const p = document.getElementById("p").value;
    if (!u || !p) return fail("账号和密码都要填");

    go.disabled = true;
    go.innerHTML = '<span class="spin"></span>正在验证…';
    try {
      const r = await Promise.race([
        AUTH.login(u, p, document.getElementById("r").checked),
        new Promise((_, rej) => setTimeout(() => rej(new Error("网络超时，请重试")), 15000)),
      ]);
      if (!r.ok) { fail(r.msg); go.disabled = false; go.textContent = "登 录"; return; }
      localStorage.setItem("amv_last_user", u);
      okName.textContent = "欢迎回来，" + r.user.u;
      okBox.classList.add("on");
      card.style.transform = "translateY(-8px) scale(.97)";
      card.style.opacity = ".35";
      setTimeout(() => location.replace(next), 780);
    } catch (err) {
      fail("登录失败：" + (err && err.message ? err.message : "网络异常"));
      go.disabled = false;
      go.textContent = "登 录";
    }
  });
})();
</script>
</body>
</html>
